<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="pageTitle">大模型 - 提示词</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #fafafa; 
      padding: 20px; 
      max-width: 1200px; 
      margin: 0 auto; 
    }
    h2 { margin: 0 0 20px; }
    .top-actions { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      align-items: center; 
      margin-bottom: 20px; 
    }
    .nav-btn { 
      padding: 8px 16px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      background: #fff; 
      text-decoration: none; 
      color: #333; 
      display: inline-block;
    }
    .nav-btn.primary { 
      background: #111; 
      color: #fff; 
      border-color: #111; 
    }
    
    .dropdown { position:relative; display:inline-block; }
    .dropdown .nav-btn { cursor:pointer; }
    .dropdown-content { display:none; position:absolute; background-color:#fff; min-width:180px; box-shadow:0 8px 16px rgba(0,0,0,.1); border-radius:8px; z-index:1000; border:1px solid #ddd; margin-top:4px; }
    .dropdown-content a { color:#333; padding:10px 16px; text-decoration:none; display:block; border-radius:0; }
    .dropdown-content a:first-child { border-radius:8px 8px 0 0; }
    .dropdown-content a:last-child { border-radius:0 0 8px 8px; }
    .dropdown-content a:hover { background-color:#f5f5f5; }
    .dropdown:hover .dropdown-content { display:block; }
    
    .add-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }
    
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      min-height: 100px;
      resize: vertical;
      font-family: inherit;
    }
    
    button {
      padding: 10px 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
      margin-top: 10px;
    }
    
    button:hover {
      background: #333;
    }
    
    button.secondary {
      background: #fff;
      color: #333;
      border-color: #ddd;
    }
    
    button.secondary:hover {
      background: #f5f5f5;
    }
    
    button.danger {
      background: #b00020;
      color: #fff;
      border-color: #b00020;
    }
    
    button.danger:hover {
      background: #c00020;
    }
    
    .prompt-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      margin: 0;
    }
    
    .prompt-item {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 3px solid #111;
    }
    
    .prompt-content {
      color: #333;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    
    .prompt-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    
    .add-prompt-form {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    button.small {
      padding: 6px 12px;
      font-size: 12px;
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="top-actions">
    <a class="nav-btn primary" href="/">去看亚马逊新品</a>
    <a class="nav-btn" href="/articles/">产品开发系列</a>
    <div class="dropdown">
      <a class="nav-btn" href="#">大模型 ▼</a>
      <div class="dropdown-content">
        <a href="/pages/model.html?m=nano-banana-pro">Nano Banana Pro</a>
        <a href="/pages/model.html?m=gpt-image-1-5">GPT Image 1.5</a>
        <a href="/pages/model.html?m=seedream-4-5">Seedream 4.5</a>
        <a href="/pages/model.html?m=gemini-3">Gemini 3</a>
      </div>
    </div>
    <a class="nav-btn" href="/pages/1688.html">1688</a>
    <a class="nav-btn" href="/pages/tiktok.html">TikTok</a>
  </div>

  <h2 id="pageHeading">大模型 - 提示词</h2>

  <div class="add-section">
    <h3 style="margin-top: 0;">添加新提示词</h3>
    <div class="form-group">
      <label for="newPrompt">提示词内容：</label>
      <textarea id="newPrompt" placeholder="输入提示词内容..."></textarea>
    </div>
    <button onclick="addPrompt()">添加提示词</button>
  </div>

  <div id="prompts"></div>

  <script>
    // 从 URL 参数获取模型标识
    function getModelSlug() {
      const params = new URLSearchParams(window.location.search);
      return params.get('m') || 'gemini-3'; // 默认使用 gemini-3
    }

    // 模型配置（从 JSON 加载）
    let MODELS_CONFIG = [];
    let currentModel = null;
    let STORAGE_KEY = '';
    let MODEL_NAME = '';

    // 加载模型配置
    async function loadModelsConfig() {
      try {
        const response = await fetch('/data/catalog/models.json');
        if (!response.ok) {
          throw new Error('Failed to load models config');
        }
        MODELS_CONFIG = await response.json();
        
        // 获取当前模型配置
        const slug = getModelSlug();
        currentModel = MODELS_CONFIG.find(m => m.slug === slug) || MODELS_CONFIG[0];
        
        if (currentModel) {
          STORAGE_KEY = currentModel.storageKey;
          MODEL_NAME = currentModel.name;
          
          // 更新页面标题和标题
          document.getElementById('pageTitle').textContent = `${MODEL_NAME} - 提示词`;
          document.getElementById('pageHeading').textContent = `${MODEL_NAME} - 提示词`;
        }
      } catch (error) {
        console.error('Error loading models config:', error);
        // 降级到硬编码配置
        const fallbackConfig = [
          { name: 'Gemini 3', slug: 'gemini-3', storageKey: 'model-gemini-3-prompts' }
        ];
        MODELS_CONFIG = fallbackConfig;
        const slug = getModelSlug();
        currentModel = fallbackConfig.find(m => m.slug === slug) || fallbackConfig[0];
        STORAGE_KEY = currentModel.storageKey;
        MODEL_NAME = currentModel.name;
        document.getElementById('pageTitle').textContent = `${MODEL_NAME} - 提示词`;
        document.getElementById('pageHeading').textContent = `${MODEL_NAME} - 提示词`;
      }
    }

    // 从 localStorage 加载数据
    function loadData() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    // 保存数据到 localStorage
    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // 添加提示词
    function addPrompt() {
      const textarea = document.getElementById('newPrompt');
      const content = textarea.value.trim();
      
      if (!content) {
        alert('请输入提示词内容');
        return;
      }

      const data = loadData();
      data.push({
        id: Date.now().toString(),
        content: content
      });
      saveData(data);
      textarea.value = '';
      render();
    }

    // 删除提示词
    function deletePrompt(promptId) {
      if (!confirm('确定要删除这个提示词吗？')) {
        return;
      }
      
      const data = loadData();
      const filtered = data.filter(p => p.id !== promptId);
      saveData(filtered);
      render();
    }

    // 编辑提示词
    function editPrompt(promptId) {
      const data = loadData();
      const prompt = data.find(p => p.id === promptId);
      if (prompt) {
        const newContent = window.prompt('请输入新的提示词内容：', prompt.content);
        if (newContent !== null && newContent.trim()) {
          prompt.content = newContent.trim();
          saveData(data);
          render();
        }
      }
    }

    // 复制提示词
    function copyPrompt(content) {
      navigator.clipboard.writeText(content).then(() => {
        alert('已复制到剪贴板');
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('已复制到剪贴板');
      });
    }

    // 渲染所有内容
    function render() {
      const data = loadData();
      const container = document.getElementById('prompts');
      
      if (data.length === 0) {
        container.innerHTML = '<div class="empty-state">还没有添加任何提示词，请在上方添加一个提示词开始使用。</div>';
        return;
      }

      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'prompt-section';
      
      const promptsHtml = data.map(p => `
        <div class="prompt-item">
          <div class="prompt-content">${escapeHtml(p.content)}</div>
          <div class="prompt-actions">
            <button class="secondary small" onclick="copyPrompt('${escapeJs(p.content)}')">复制</button>
            <button class="secondary small" onclick="editPrompt('${p.id}')">编辑</button>
            <button class="danger small" onclick="deletePrompt('${p.id}')">删除</button>
          </div>
        </div>
      `).join('');
      
      sectionDiv.innerHTML = `
        <div class="section-header">
          <h3 class="section-title">${MODEL_NAME}</h3>
        </div>
        ${promptsHtml}
      `;
      
      container.innerHTML = '';
      container.appendChild(sectionDiv);
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // JavaScript 字符串转义
    function escapeJs(text) {
      return text.replace(/\\/g, '\\\\')
                 .replace(/'/g, "\\'")
                 .replace(/"/g, '\\"')
                 .replace(/\n/g, '\\n')
                 .replace(/\r/g, '\\r');
    }

    // 初始化
    (async () => {
      await loadModelsConfig();
      render();
    })();
  </script>
</body>
</html>
