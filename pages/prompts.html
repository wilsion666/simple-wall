      const params = new URLSearchParams(window.location.search);
      return params.get('p') || 'operation'; // 默认使用 operation
    }

    // 提示词配置（从 JSON 加载）
    let PROMPTS_CONFIG = [];
    let currentCategory = null;
    let STORAGE_KEY = '';
    let CATEGORY_NAME = '';
    let DEFAULT_PROMPTS = [];

    // 加载提示词配置
    async function loadPromptsConfig() {
      try {
        const response = await fetch('/data/catalog/prompts.json');
        if (!response.ok) {
          throw new Error('Failed to load prompts config');
        }
        PROMPTS_CONFIG = await response.json();
        
        // 获取当前类别配置
        const slug = getPromptSlug();
        currentCategory = PROMPTS_CONFIG.find(p => p.slug === slug) || PROMPTS_CONFIG[0];
        
        if (currentCategory) {
          STORAGE_KEY = currentCategory.storageKey;
          CATEGORY_NAME = currentCategory.name;
          
          // 更新页面标题和标题
          document.getElementById('pageTitle').textContent = `${CATEGORY_NAME} - 提示词`;
          document.getElementById('pageHeading').textContent = `${CATEGORY_NAME} - 提示词`;
          
          // 如果是运营或产品开发类别，加载预设提示词
          if (currentCategory.hasDefaultPrompts) {
            DEFAULT_PROMPTS = getDefaultPrompts(currentCategory.slug);
          } else {
            DEFAULT_PROMPTS = [];
          }
        }
      } catch (error) {
        console.error('Error loading prompts config:', error);
        // 降级到硬编码配置

    // 获取当前类别配置
    function getCurrentCategory() {
      const slug = getPromptSlug();
      return PROMPT_CATEGORIES[slug] || PROMPT_CATEGORIES['operation'];
    }

    // 获取当前类别配置（已通过 loadPromptsConfig 设置）
    function getCurrentCategory() {
      return currentCategory || PROMPTS_CONFIG[0];
    }
    
    let currentEditingId = null;

    // 从 localStorage 加载数据
    function loadData() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        const parsed = JSON.parse(data);
        // 兼容旧数据格式：如果只有content，转换为新格式
        return parsed.map(item => {
          if (!item.title && item.content) {
            return {
              id: item.id,
              title: item.content,
              content: ''
            };
          }
          return item;
        });
      }
      // 如果没有数据且有预设提示词，初始化预设提示词
      if (!DEFAULT_PROMPTS || DEFAULT_PROMPTS.length === 0) {
        return [];
      }
      const initialData = DEFAULT_PROMPTS.map((prompt, index) => ({
        id: `default-${index}-${Date.now()}`,
        title: prompt.title,
        content: prompt.content || ''
      }));
      saveData(initialData);
      return initialData;
    }

    // 保存数据到 localStorage
    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // 添加提示词
    function addPrompt() {
      const titleInput = document.getElementById('newPromptTitle');
      const contentTextarea = document.getElementById('newPromptContent');
      const title = titleInput.value.trim();
      const content = contentTextarea.value.trim();
      
      if (!title) {
        alert('请输入提示词名称');
        return;
      }

      const data = loadData();
      data.push({
        id: Date.now().toString(),
        title: title,
        content: content
      });
      saveData(data);
      titleInput.value = '';
      contentTextarea.value = '';
      render();
    }

    // 删除提示词
    function deletePrompt(promptId) {
      if (!confirm('确定要删除这个提示词吗？')) {
        return;
      }
      
      const data = loadData();
      const filtered = data.filter(p => p.id !== promptId);
      saveData(filtered);
      render();
    }

    // 打开编辑模态框
    function editPrompt(promptId) {
      const data = loadData();
      const prompt = data.find(p => p.id === promptId);
      if (prompt) {
        currentEditingId = promptId;
        document.getElementById('editPromptTitle').value = prompt.title || '';
        document.getElementById('editPromptContent').value = prompt.content || '';
        document.getElementById('modalTitle').textContent = '编辑提示词';
        document.getElementById('promptModal').style.display = 'block';
      }
    }
    
    // 保存提示词
    function savePrompt() {
      if (currentEditingId === null) return;
      
      const titleInput = document.getElementById('editPromptTitle');
      const contentTextarea = document.getElementById('editPromptContent');
      const title = titleInput.value.trim();
      const content = contentTextarea.value.trim();
      
      if (!title) {
        alert('请输入提示词名称');
        return;
      }
      
      const data = loadData();
      const prompt = data.find(p => p.id === currentEditingId);
      if (prompt) {
        prompt.title = title;
        prompt.content = content;
        saveData(data);
        closeModal();
        render();
      }
    }
    
    // 关闭模态框
    function closeModal() {
      document.getElementById('promptModal').style.display = 'none';
      currentEditingId = null;
    }
    
    // 复制模态框内容
    function copyModalContent() {
      const content = document.getElementById('editPromptContent').value;
      copyPrompt(content);
    }
    
    // 点击模态框外部关闭
    window.onclick = function(event) {
      const modal = document.getElementById('promptModal');
      if (event.target === modal) {
        closeModal();
      }
    }

    // 复制提示词（复制详细内容）
    function copyPrompt(content) {
      if (!content) {
        alert('该提示词还没有详细内容');
        return;
      }
      navigator.clipboard.writeText(content).then(() => {
        alert('已复制到剪贴板');
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('已复制到剪贴板');
      });
    }

    // 渲染所有内容
    function render() {
      const data = loadData();
      const container = document.getElementById('prompts');
      
      if (data.length === 0) {
        container.innerHTML = '<div class="empty-state">还没有添加任何提示词，请在上方添加一个提示词开始使用。</div>';
        return;
      }

      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'prompt-section';
      
      const promptsHtml = data.map(p => {
        const title = p.title || p.content || '未命名';
        const content = p.content || '';
        const hasContent = content.trim().length > 0;
        return `
        <div class="prompt-item">
          <div class="prompt-title">${escapeHtml(title)}</div>
          ${hasContent ? `<div class="prompt-content-preview">${escapeHtml(content.substring(0, 100))}${content.length > 100 ? '...' : ''}</div>` : '<div class="prompt-content-preview" style="color: #999;">暂无详细内容</div>'}
          <div class="prompt-actions">
            ${hasContent ? `<button class="secondary small" onclick="copyPrompt('${escapeJs(content)}')">复制</button>` : ''}
            <button class="secondary small" onclick="editPrompt('${p.id}')">${hasContent ? '编辑' : '添加内容'}</button>
            <button class="danger small" onclick="deletePrompt('${p.id}')">删除</button>
          </div>
        </div>
      `;
      }).join('');
      
      sectionDiv.innerHTML = `
        <div class="section-header">
          <h3 class="section-title">${CATEGORY_NAME}</h3>
        </div>
        <div class="prompts-grid">
          ${promptsHtml}
        </div>
      `;
      
      container.innerHTML = '';
      container.appendChild(sectionDiv);
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // JavaScript 字符串转义
    function escapeJs(text) {
      return text.replace(/\\/g, '\\\\')
                 .replace(/'/g, "\\'")
                 .replace(/"/g, '\\"')
                 .replace(/\n/g, '\\n')
                 .replace(/\r/g, '\\r');
    }

    // 初始化
    (async () => {
      await loadPromptsConfig();
      render();
    })();
  </script>
