<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大模型提示词</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #fafafa; 
      padding: 20px; 
      max-width: 1200px; 
      margin: 0 auto; 
    }
    h2 { margin: 0 0 20px; }
    .top-actions { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      align-items: center; 
      margin-bottom: 20px; 
    }
    .nav-btn { 
      padding: 8px 16px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      background: #fff; 
      text-decoration: none; 
      color: #333; 
      display: inline-block;
    }
    .nav-btn.primary { 
      background: #111; 
      color: #fff; 
      border-color: #111; 
    }
    
    .add-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }
    
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    textarea {
      min-height: 100px;
      resize: vertical;
      font-family: inherit;
    }
    
    button {
      padding: 10px 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
      margin-top: 10px;
    }
    
    button:hover {
      background: #333;
    }
    
    button.secondary {
      background: #fff;
      color: #333;
      border-color: #ddd;
    }
    
    button.secondary:hover {
      background: #f5f5f5;
    }
    
    button.danger {
      background: #b00020;
      color: #fff;
      border-color: #b00020;
    }
    
    button.danger:hover {
      background: #c00020;
    }
    
    .prompt-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      margin: 0;
    }
    
    .section-actions {
      display: flex;
      gap: 10px;
    }
    
    .prompt-item {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 3px solid #111;
    }
    
    .prompt-content {
      color: #333;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    
    .prompt-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    
    .add-prompt-form {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }
    
    .subtitle-section {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      border-left: 3px solid #666;
    }
    
    .subtitle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .subtitle-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin: 0;
    }
    
    .subtitle-actions {
      display: flex;
      gap: 8px;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .hidden {
      display: none;
    }
    
    button.small {
      padding: 6px 12px;
      font-size: 12px;
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="top-actions">
    <a class="nav-btn primary" href="/">去看亚马逊新品</a>
    <a class="nav-btn" href="/articles/">产品开发系列</a>
    <a class="nav-btn" href="/prompts.html">提示词</a>
    <a class="nav-btn" href="/1688.html">1688</a>
    <a class="nav-btn" href="/tiktok.html">TikTok</a>
  </div>

  <h2>大模型提示词</h2>

  <div class="add-section">
    <h3 style="margin-top: 0;">添加子标题</h3>
    <div class="form-group">
      <label for="newSubtitle">子标题名称：</label>
      <input type="text" id="newSubtitle" placeholder="例如：Claude" />
    </div>
    <button onclick="addNewSubtitle()">添加子标题</button>
  </div>

  <div id="sections"></div>

  <script>
    // 从 localStorage 加载数据
    function loadData() {
      const data = localStorage.getItem('model-prompts');
      if (data) {
        return JSON.parse(data);
      }
      // 如果没有数据，初始化"大模型"标题和子标题
      const initialData = [{
        id: 'model-main',
        title: '大模型',
        subtitles: [
          {
            id: 'gpt52',
            name: 'GPT5.2',
            prompts: []
          },
          {
            id: 'gpt4o',
            name: 'GPT4o',
            prompts: []
          },
          {
            id: 'gemini3',
            name: 'gemini3',
            prompts: []
          }
        ]
      }];
      saveData(initialData);
      return initialData;
    }

    // 保存数据到 localStorage
    function saveData(data) {
      localStorage.setItem('model-prompts', JSON.stringify(data));
    }
    
    // 添加子标题
    function addNewSubtitle() {
      const subtitleInput = document.getElementById('newSubtitle');
      const subtitleName = subtitleInput.value.trim();
      
      if (!subtitleName) {
        alert('请输入子标题名称');
        return;
      }

      const data = loadData();
      const section = data.find(s => s.id === 'model-main');
      if (section) {
        if (!section.subtitles) {
          section.subtitles = [];
        }
        section.subtitles.push({
          id: Date.now().toString(),
          name: subtitleName,
          prompts: []
        });
        saveData(data);
        subtitleInput.value = '';
        render();
      }
    }
    
    // 删除子标题
    function deleteSubtitle(subtitleId) {
      if (!confirm('确定要删除这个子标题及其所有提示词吗？')) {
        return;
      }
      
      const data = loadData();
      const section = data.find(s => s.id === 'model-main');
      if (section && section.subtitles) {
        section.subtitles = section.subtitles.filter(st => st.id !== subtitleId);
        saveData(data);
        render();
      }
    }

    // 添加提示词
    function addPrompt(subtitleId) {
      const inputId = `prompt-input-${subtitleId}`;
      const textarea = document.getElementById(inputId);
      const content = textarea.value.trim();
      
      if (!content) {
        alert('请输入提示词内容');
        return;
      }

      const data = loadData();
      const section = data.find(s => s.id === 'model-main');
      if (section) {
        const subtitle = section.subtitles?.find(st => st.id === subtitleId);
        if (subtitle) {
          if (!subtitle.prompts) subtitle.prompts = [];
          subtitle.prompts.push({
            id: Date.now().toString(),
            content: content
          });
          saveData(data);
          textarea.value = '';
          render();
        }
      }
    }

    // 删除提示词
    function deletePrompt(subtitleId, promptId) {
      const data = loadData();
      const section = data.find(s => s.id === 'model-main');
      if (section) {
        const subtitle = section.subtitles?.find(st => st.id === subtitleId);
        if (subtitle && subtitle.prompts) {
          subtitle.prompts = subtitle.prompts.filter(p => p.id !== promptId);
          saveData(data);
          render();
        }
      }
    }

    // 编辑提示词
    function editPrompt(subtitleId, promptId) {
      const data = loadData();
      const section = data.find(s => s.id === 'model-main');
      if (section) {
        const subtitle = section.subtitles?.find(st => st.id === subtitleId);
        if (subtitle && subtitle.prompts) {
          const prompt = subtitle.prompts.find(p => p.id === promptId);
          if (prompt) {
            const newContent = window.prompt('请输入新的提示词内容：', prompt.content);
            if (newContent !== null && newContent.trim()) {
              prompt.content = newContent.trim();
              saveData(data);
              render();
            }
          }
        }
      }
    }

    // 复制提示词
    function copyPrompt(content) {
      navigator.clipboard.writeText(content).then(() => {
        alert('已复制到剪贴板');
      }).catch(() => {
        // 降级方案
        const textarea = document.createElement('textarea');
        textarea.value = content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('已复制到剪贴板');
      });
    }

    // 渲染所有内容
    function render() {
      const data = loadData();
      const container = document.getElementById('sections');
      
      if (data.length === 0) {
        container.innerHTML = '<div class="empty-state">加载中...</div>';
        return;
      }

      container.innerHTML = '';

      data.forEach(section => {
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'prompt-section';
        
        // 渲染子标题
        let subtitlesHtml = '';
        if (section.subtitles && section.subtitles.length > 0) {
          subtitlesHtml = section.subtitles.map(subtitle => {
            const promptsHtml = subtitle.prompts && subtitle.prompts.length > 0 
              ? subtitle.prompts.map(p => `
                <div class="prompt-item">
                  <div class="prompt-content">${escapeHtml(p.content)}</div>
                  <div class="prompt-actions">
                    <button class="secondary small" onclick="copyPrompt('${escapeJs(p.content)}')">复制</button>
                    <button class="secondary small" onclick="editPrompt('${subtitle.id}', '${p.id}')">编辑</button>
                    <button class="danger small" onclick="deletePrompt('${subtitle.id}', '${p.id}')">删除</button>
                  </div>
                </div>
              `).join('')
              : '<div class="empty-state" style="padding: 20px;">该子标题下还没有提示词</div>';
            
            return `
              <div class="subtitle-section">
                <div class="subtitle-header">
                  <h4 class="subtitle-title">${escapeHtml(subtitle.name)}</h4>
                  <div class="subtitle-actions">
                    <button class="danger small" onclick="deleteSubtitle('${subtitle.id}')">删除子标题</button>
                  </div>
                </div>
                ${promptsHtml}
                <div class="add-prompt-form">
                  <label for="prompt-input-${subtitle.id}">添加新提示词：</label>
                  <textarea id="prompt-input-${subtitle.id}" placeholder="输入提示词内容..."></textarea>
                  <button class="small" onclick="addPrompt('${subtitle.id}')">添加提示词</button>
                </div>
              </div>
            `;
          }).join('');
        }
        
        sectionDiv.innerHTML = `
          <div class="section-header">
            <h3 class="section-title">${escapeHtml(section.title)}</h3>
          </div>
          
          ${subtitlesHtml}
        `;
        
        container.appendChild(sectionDiv);
      });
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // JavaScript 字符串转义
    function escapeJs(text) {
      return text.replace(/\\/g, '\\\\')
                 .replace(/'/g, "\\'")
                 .replace(/"/g, '\\"')
                 .replace(/\n/g, '\\n')
                 .replace(/\r/g, '\\r');
    }

    // 初始化
    render();
  </script>
</body>
</html>
