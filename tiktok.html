<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok 产品墙</title>
  <style>
    :root{
      --bg:#f6f7fb;--card:#fff;--text:#111;--muted:#666;
      --shadow:0 6px 20px rgba(20,20,40,.08);--radius:16px;
    }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei";background:var(--bg);color:var(--text);}
    .wrap{max-width:1280px;margin:24px auto;padding:0 16px;}
    h1{margin:0 0 8px;font-size:28px;}
    .hint{color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.6}
    .topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 18px;}
    input,select,button{
      border:1px solid #ddd;border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;
    }
    button{cursor:pointer}
    .meta{margin-left:auto;color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;}
    @media (max-width:1200px){.grid{grid-template-columns:repeat(4,1fr);}}
    @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
    @media (max-width:520px){.grid{grid-template-columns:repeat(1,1fr);}}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
    .imgbox{background:#fff;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
    .imgbox img{max-width:100%;max-height:100%;object-fit:contain;display:block}
    .pad{padding:12px 14px}
    .id{font-weight:800;margin:0 0 6px}
    .sales{font-weight:700;margin:0 0 8px}
    .title{color:var(--muted);font-size:13px;margin:0 0 10px;line-height:1.4;min-height:18px}
    a{color:#1a73e8;text-decoration:none;font-size:13px}
    a:hover{text-decoration:underline}
    .pager{display:flex;gap:10px;align-items:center;margin:16px 0 40px;}
    .pager .pageinfo{color:var(--muted);font-size:13px;margin-left:auto}
    .nav{display:flex;gap:10px;align-items:center;margin-bottom:8px}
    .nav a{font-size:13px}
    .badge{display:inline-block;background:#eef2ff;color:#2b3aee;border-radius:999px;padding:2px 8px;font-size:12px;margin-left:8px}
    .top-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px; padding:0 16px; max-width:1280px; margin:20px auto 12px; }
    .nav-btn { padding:8px 16px; border:1px solid #ddd; border-radius:8px; background:#fff; text-decoration:none; color:#333; display:inline-block; font-size:14px; }
    .nav-btn.primary { background:#111; color:#fff; border-color:#111; }
    .dropdown { position:relative; display:inline-block; }
    .dropdown .nav-btn { cursor:pointer; }
    .dropdown-content { display:none; position:absolute; background-color:#fff; min-width:180px; box-shadow:0 8px 16px rgba(0,0,0,.1); border-radius:8px; z-index:1000; border:1px solid #ddd; margin-top:4px; }
    .dropdown-content a { color:#333; padding:10px 16px; text-decoration:none; display:block; border-radius:0; }
    .dropdown-content a:first-child { border-radius:8px 8px 0 0; }
    .dropdown-content a:last-child { border-radius:0 0 8px 8px; }
    .dropdown-content a:hover { background-color:#f5f5f5; }
    .dropdown:hover .dropdown-content { display:block; }
  </style>
</head>
<body>
  <div class="top-actions">
    <a class="nav-btn primary" href="/">去看亚马逊新品</a>
    <a class="nav-btn" href="/articles/">产品开发系列</a>
    <div class="dropdown">
      <a class="nav-btn" href="#">提示词 ▼</a>
      <div class="dropdown-content">
        <a href="/prompts-operation.html">运营</a>
        <a href="/prompts-product.html">产品开发</a>
        <a href="/prompts-advertising.html">广告</a>
        <a href="/prompts-influencer.html">红人</a>
      </div>
    </div>
    <div class="dropdown">
      <a class="nav-btn" href="#">大模型 ▼</a>
      <div class="dropdown-content">
        <a href="/model-nano-banana-pro.html">Nano Banana Pro</a>
        <a href="/model-gpt-image-1.5.html">GPT Image 1.5</a>
        <a href="/model-seedream-4.5.html">Seedream 4.5</a>
        <a href="/model-gemini-3.html">Gemini 3</a>
      </div>
    </div>
    <a class="nav-btn" href="/1688.html">1688</a>
  </div>
  <div class="wrap">
    <div class="nav">
      <a href="/">← 返回首页</a>
      <span class="badge">CSV + 图片</span>
    </div>

    <h1>TikTok 产品墙</h1>
    <div class="hint">
      规则：<b>tiktok.csv</b> 放根目录；图片放 <b>/images/tiktok/</b>；图片名与 <b>ID</b> 对齐（例如：<code>1731421545690796125.jpg</code>）。<br/>
      兼容表头：<b>ID/销量/链接</b> 或 <b>id/sales/tiktok_url</b>。标题可选：<b>标题/title</b>。
    </div>

    <div class="topbar">
      <input id="q" placeholder="搜索：ID / 标题" style="min-width:260px" />
      <select id="sort">
        <option value="salesDesc">按销量：高→低</option>
        <option value="salesAsc">按销量：低→高</option>
        <option value="idAsc">按ID：小→大</option>
        <option value="idDesc">按ID：大→小</option>
      </select>
      <select id="per">
        <option value="60">每页 60</option>
        <option value="100" selected>每页 100</option>
        <option value="200">每页 200</option>
      </select>
      <button id="reload">重新加载</button>
      <div class="meta" id="meta">加载中…</div>
    </div>

    <div class="pager">
      <button id="prev">上一页</button>
      <button id="next">下一页</button>
      <div class="pageinfo" id="pageinfo"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="pager">
      <button id="prev2">上一页</button>
      <button id="next2">下一页</button>
      <div class="pageinfo" id="pageinfo2"></div>
    </div>
  </div>

<script>
  // ---- 小工具：更“耐脏”的CSV解析（支持逗号/分号/tab） ----
  function splitLine(line){
    // 简单兼容：优先 tab，其次逗号，其次分号
    const hasTab = line.includes('\t');
    const hasComma = line.includes(',');
    const hasSemi = line.includes(';');
    let sep = hasTab ? '\t' : (hasComma ? ',' : (hasSemi ? ';' : ','));
    // 处理带引号的CSV
    const out = [];
    let cur = '', inQ = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch === '"'){
        if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
        else inQ = !inQ;
      }else if(ch === sep && !inQ){
        out.push(cur); cur = '';
      }else{
        cur += ch;
      }
    }
    out.push(cur);
    return out.map(s => s.trim());
  }

  function parseCSV(text){
    const lines = text.replace(/\r/g,'').split('\n').filter(x => x.trim().length);
    if(!lines.length) return [];
    const rows = lines.map(splitLine);
    return rows;
  }

  function norm(s){ return String(s||'').trim().toLowerCase(); }

  function findCol(header, candidates){
    const h = header.map(norm);
    for(const c of candidates){
      const idx = h.indexOf(norm(c));
      if(idx !== -1) return idx;
    }
    return -1;
  }

  function toNum(x){
    if(x==null) return 0;
    const s = String(x).replace(/,/g,'').trim();
    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  }

  // ---- 主逻辑 ----
  const grid = document.getElementById('grid');
  const meta = document.getElementById('meta');
  const pageinfo = document.getElementById('pageinfo');
  const pageinfo2 = document.getElementById('pageinfo2');

  let all = [];
  let page = 1;

  async function load(){
    meta.textContent = '加载中…';
    grid.innerHTML = '';
    page = 1;

    // cache buster，避免浏览器缓存旧csv
    const res = await fetch('tiktok.csv?v=' + Date.now());
    const text = await res.text();
    const table = parseCSV(text);

    if(!table.length){
      alert('tiktok.csv 为空或无法解析');
      return;
    }

    const header = table[0];

    // 兼容你的表头：ID / 销量 / 链接
    const iId = findCol(header, ['id','ID','Id','商品ID','product_id']);
    const iSales = findCol(header, ['销量','sales','month_sales','月销量']);
    const iUrl = findCol(header, ['链接','tiktok_url','url','link']);
    const iTitle = findCol(header, ['标题','title','name']);

    if(iId === -1 || iUrl === -1){
      alert('tiktok.csv 表头至少需要包含：ID（或 id） + 链接（或 tiktok_url）\n你当前表头是：' + header.join(' / '));
      return;
    }

    all = table.slice(1).map(r => {
      const id = String(r[iId]||'').trim();
      const sales = iSales === -1 ? 0 : toNum(r[iSales]);
      const url = String(r[iUrl]||'').trim();
      const title = iTitle === -1 ? '' : String(r[iTitle]||'').trim();
      return { id, sales, url, title };
    }).filter(x => x.id && x.url);

    meta.textContent = `共 ${all.length} 个`;
    render();
  }

  function getFiltered(){
    const q = document.getElementById('q').value.trim().toLowerCase();
    let list = all;

    if(q){
      list = list.filter(x =>
        x.id.toLowerCase().includes(q) ||
        (x.title||'').toLowerCase().includes(q)
      );
    }

    const sort = document.getElementById('sort').value;
    list = [...list].sort((a,b)=>{
      if(sort === 'salesDesc') return b.sales - a.sales;
      if(sort === 'salesAsc') return a.sales - b.sales;
      if(sort === 'idDesc') return (b.id > a.id) ? 1 : -1;
      return (a.id > b.id) ? 1 : -1;
    });

    return list;
  }

  function imgSrcFor(id){
    // 你可以统一用 jpg；这里做一点兼容：jpg/png/webp 都试
    // 注意：浏览器不会自动“依次尝试”，所以我们用 onerror 兜底切换
    return `images/tiktok/${id}.jpg`;
  }

  function makeCard(item){
    const div = document.createElement('div');
    div.className = 'card';

    const imgbox = document.createElement('div');
    imgbox.className = 'imgbox';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = imgSrcFor(item.id);
    img.alt = item.id;

    // 兜底：jpg -> png -> webp
    img.onerror = () => {
      if(img.dataset.try === 'png'){ img.dataset.try = 'webp'; img.src = `images/tiktok/${item.id}.webp`; return; }
      if(img.dataset.try === 'jpg'){ img.dataset.try = 'png'; img.src = `images/tiktok/${item.id}.png`; return; }
      img.dataset.try = 'jpg';
    };
    img.dataset.try = 'jpg';

    imgbox.appendChild(img);

    const pad = document.createElement('div');
    pad.className = 'pad';

    const id = document.createElement('div');
    id.className = 'id';
    id.textContent = `ID: ${item.id}`;

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = item.title ? item.title : ' ';

    const sales = document.createElement('div');
    sales.className = 'sales';
    sales.textContent = item.sales ? `销量：${item.sales}` : ' ';

    const a = document.createElement('a');
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '打开 TikTok 链接';

    pad.appendChild(id);
    pad.appendChild(title);
    pad.appendChild(sales);
    pad.appendChild(a);

    div.appendChild(imgbox);
    div.appendChild(pad);
    return div;
  }

  function render(){
    const list = getFiltered();
    const per = Number(document.getElementById('per').value || 100);
    const pages = Math.max(1, Math.ceil(list.length / per));
    page = Math.min(page, pages);

    const start = (page - 1) * per;
    const slice = list.slice(start, start + per);

    grid.innerHTML = '';
    slice.forEach(item => grid.appendChild(makeCard(item)));

    pageinfo.textContent = `第 ${page}/${pages} 页`;
    pageinfo2.textContent = `第 ${page}/${pages} 页`;
  }

  // events
  document.getElementById('q').addEventListener('input', ()=>{ page=1; render(); });
  document.getElementById('sort').addEventListener('change', ()=>{ page=1; render(); });
  document.getElementById('per').addEventListener('change', ()=>{ page=1; render(); });

  function prev(){ if(page>1){ page--; render(); } }
  function next(){
    const list = getFiltered();
    const per = Number(document.getElementById('per').value || 100);
    const pages = Math.max(1, Math.ceil(list.length / per));
    if(page<pages){ page++; render(); }
  }

  document.getElementById('prev').onclick = prev;
  document.getElementById('prev2').onclick = prev;
  document.getElementById('next').onclick = next;
  document.getElementById('next2').onclick = next;
  document.getElementById('reload').onclick = load;

  load();
</script>
</body>
</html>
