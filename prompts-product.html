  <h2>产品开发 - 提示词</h2>

  <div id="prompts"></div>

  <script>
    const STORAGE_KEY = 'prompts-product';
    const CATEGORY_NAME = '产品开发';

    // 预设提示词列表（包含详细内容）
    const DEFAULT_PROMPTS = [
      {
        title: '亚马逊产品开发经理',
        content: `你是一名🇺🇸美国亚马逊资深产品开发经理，擅长市场调研、竞品拆解、成本与风险评估。
规则：只基于我提供的信息回答；不确定写【未知】；不编造市场规模/份额/营收等数值（如需数据请说明需要的来源类型）。

请输出一份产品开发报告（缺失信息就标注未知）：
1) 市场概览：趋势/生命周期/旺淡季（结论+依据/需要数据）
2) 竞争格局：主流价格带、头部卖点、常见差评点、竞争强度
3) 头部品牌Top（表格）：品牌｜国家｜核心优势｜我可借鉴点
4) 用户洞察（表格）：TOP购买动机20条｜未满足需求10条｜典型场景/时间
5) 产品方案建议：我最建议做的1-2个款式（外观/材料/功能/定位/包装）
6) 成本结构：BOM大项（表格：部件/材料｜作用｜成本占比区间｜风险点）
7) 合规与侵权风险：宣传词雷区/认证注意点/专利规避方法
8) 风险清单：从选品-打样-上架-广告-售后各阶段的关键注意点
9) SWOT + PEST + 进入可行性评分（0-10）与理由`
      },
      {
        title: '市场调研',
        content: `你是一名🇺🇸美国市场调研专家，专注受众与需求洞察。
规则：不编造占比/具体数据；没有数据写【未知】并说明需要哪些数据来源。

任务：分析美国目标受众并用表格输出：
表格字段：维度｜分群结论｜典型特征｜购买驱动（意图）｜常见反对点｜我可用的卖点/文案方向
维度至少包含：性别｜年龄｜职业/使用场景｜兴趣｜收入｜教育｜家庭情况｜常一起购买的产品

最后补充：
- 最值得优先切入的2个细分人群 + 理由
- 建议验证的3个关键假设（用什么数据验证）`
      }
    ];

    // 从 localStorage 加载数据
    function loadData() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        const parsed = JSON.parse(data);
        // 兼容旧数据格式：如果只有content，转换为新格式
        return parsed.map(item => {
          if (!item.title && item.content) {
            return {
              id: item.id,
              title: item.content,
              content: ''
            };
          }
          return item;
        });
      }
      // 如果没有数据，初始化预设提示词
      const initialData = DEFAULT_PROMPTS.map((prompt, index) => ({
        id: `default-${index}-${Date.now()}`,
        title: prompt.title,
        content: prompt.content || ''
      }));
      saveData(initialData);
      return initialData;
    }

    // 保存数据到 localStorage
    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // 复制提示词（复制详细内容）
    function copyPrompt(content) {
      if (!content) {
        alert('该提示词还没有详细内容');
        return;
      }
      navigator.clipboard.writeText(content).then(() => {
        alert('已复制到剪贴板');
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('已复制到剪贴板');
      });
    }

    // 渲染所有内容
    function render() {
      const data = loadData();
      const container = document.getElementById('prompts');
      
      if (data.length === 0) {
        container.innerHTML = '<div class="empty-state">还没有添加任何提示词，请在上方添加一个提示词开始使用。</div>';
        return;
      }

      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'prompt-section';
      
      const promptsHtml = data.map(p => {
        const title = p.title || p.content || '未命名';
        const content = p.content || '';
        const hasContent = content.trim().length > 0;
        return `
        <div class="prompt-item">
          <div class="prompt-title">${escapeHtml(title)}</div>
          ${hasContent ? `<div class="prompt-content-preview">${escapeHtml(content.substring(0, 100))}${content.length > 100 ? '...' : ''}</div>` : '<div class="prompt-content-preview" style="color: #999;">暂无详细内容</div>'}
          <div class="prompt-actions">
            ${hasContent ? `<button class="secondary small" onclick="copyPrompt('${escapeJs(content)}')">复制</button>` : ''}
          </div>
        </div>
      `;
      }).join('');
      
      sectionDiv.innerHTML = `
        <div class="section-header">
          <h3 class="section-title">${CATEGORY_NAME}</h3>
        </div>
        <div class="prompts-grid">
          ${promptsHtml}
        </div>
      `;
      
      container.innerHTML = '';
      container.appendChild(sectionDiv);
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // JavaScript 字符串转义
    function escapeJs(text) {
      return text.replace(/\\/g, '\\\\')
                 .replace(/'/g, "\\'")
                 .replace(/"/g, '\\"')
                 .replace(/\n/g, '\\n')
                 .replace(/\r/g, '\\r');
    }

    // 初始化
    render();
  </script>
