<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>亚马逊新品</title>
  <style>
    body { font-family: Arial, sans-serif; background:#fafafa; padding:20px; }
    h2 { margin: 0 0 12px; }
    .top-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    .nav-btn { padding:8px 10px; border:1px solid #ddd; border-radius:10px; background:#fff; text-decoration:none; color:#333; }
    .nav-btn.primary { background:#111; color:#fff; border-color:#111; }
    
    .dropdown { position:relative; display:inline-block; }
    .dropdown .nav-btn { cursor:pointer; }
    .dropdown-content { display:none; position:absolute; background-color:#fff; min-width:180px; box-shadow:0 8px 16px rgba(0,0,0,.1); border-radius:8px; z-index:1000; border:1px solid #ddd; margin-top:4px; }
    .dropdown-content a { color:#333; padding:10px 16px; text-decoration:none; display:block; border-radius:0; }
    .dropdown-content a:first-child { border-radius:8px 8px 0 0; }
    .dropdown-content a:last-child { border-radius:0 0 8px 8px; }
    .dropdown-content a:hover { background-color:#f5f5f5; }
    .dropdown:hover .dropdown-content { display:block; }

    .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin: 10px 0 16px; }
    input, select, button { padding:8px 10px; border:1px solid #ddd; border-radius:8px; background:#fff; }
    button { cursor:pointer; }

    .wrap { display:flex; gap:16px; flex-wrap:wrap; align-items:stretch; }
    .card { width:260px; background:#fff; border-radius:12px; padding:10px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .imgbox { border-radius:10px; overflow:hidden; background:#f2f2f2; }
    img { width:100%; display:block; }
    .meta { margin-top:8px; font-size:14px; line-height:1.6; }
    .asin { font-weight:700; }
    .sales { font-weight:700; }
    a { color:#0066cc; text-decoration:none; }
    .pager { margin-top:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .muted { color:#666; font-size:13px; }
    .pill { padding:6px 10px; border:1px solid #eee; border-radius:999px; background:#fff; }
    .danger { color:#b00020; }
  </style>
</head>

<body>
  <div class="top-actions">
    <a class="nav-btn primary" href="/">去看亚马逊新品</a>
    <a class="nav-btn" href="/articles/">产品开发系列</a>
    <div class="dropdown">
      <a class="nav-btn" href="#">提示词 ▼</a>
      <div class="dropdown-content">
        <a href="/prompts-operation.html">运营</a>
        <a href="/prompts-product.html">产品开发</a>
        <a href="/prompts-advertising.html">广告</a>
        <a href="/prompts-influencer.html">红人</a>
      </div>
    </div>
    <div class="dropdown">
      <a class="nav-btn" href="#">大模型 ▼</a>
      <div class="dropdown-content">
        <a href="/model-nano-banana-pro.html">Nano Banana Pro</a>
        <a href="/model-gpt-image-1.5.html">GPT Image 1.5</a>
        <a href="/model-seedream-4.5.html">Seedream 4.5</a>
        <a href="/model-gemini-3.html">Gemini 3</a>
      </div>
    </div>
    <a class="nav-btn" href="/1688.html">1688</a>
    <a class="nav-btn" href="/tiktok.html">TikTok</a>
  </div>

  <h2 id="title">亚马逊新品</h2>

  <div class="bar">
    <select id="cat"></select>

    <input id="q" placeholder="搜索 ASIN" style="min-width:220px;" />
    <select id="sort">
      <option value="salesDesc">按月销量：高→低</option>
      <option value="salesAsc">按月销量：低→高</option>
      <option value="asinAsc">按 ASIN：A→Z</option>
      <option value="asinDesc">按 ASIN：Z→A</option>
    </select>

    <select id="pageSize">
      <option value="50">每页 50</option>
      <option value="100" selected>每页 100</option>
      <option value="200">每页 200</option>
    </select>

    <button id="reload">重新加载</button>
    <span class="muted pill" id="stat">未加载</span>
    <span class="muted" id="hint"></span>
  </div>

  <div class="wrap" id="grid"></div>

  <div class="pager">
    <button id="prev">上一页</button>
    <span class="muted" id="pageInfo"></span>
    <button id="next">下一页</button>
  </div>

<script>
  /**
   * ✅ 你只需要维护这个表
   * 说明：你的 CSV 当前在【仓库根目录】（不是 articles/），所以 csv 写成 "xxx.csv"
   * 图片在 images/<类目文件夹>/<ASIN>.jpg，所以 imgDir 写 images/xxx
   */
  const CATEGORIES = [
    { key: "industrial-scientific", name: "Industrial & Scientific", csv: "Industrial & Scientific.csv", imgDir: "images/Industrial & Scientific" },
    { key: "musical-instruments", name: "Musical Instruments", csv: "Musical Instruments.csv", imgDir: "images/Musical Instruments" },
    { key: "office-products", name: "Office Products", csv: "Office Products.csv", imgDir: "images/Office Products" },
    { key: "patio-lawn-garden", name: "Patio, Lawn & Garden", csv: "Patio, Lawn & Garden.csv", imgDir: "images/Patio, Lawn & Garden" },
    { key: "pet-supplies", name: "Pet Supplies", csv: "Pet Supplies.csv", imgDir: "images/Pet Supplies" },
    { key: "sports-outdoors", name: "Sports & Outdoors", csv: "Sports & Outdoors.csv", imgDir: "images/Sports & Outdoors" },
    { key: "tools-home-improvement", name: "Tools & Home Improvement", csv: "Tools & Home Improvement.csv", imgDir: "images/Tools & Home Improvement" },
    { key: "toys-games", name: "Toys & Games", csv: "Toys & Games.csv", imgDir: "images/Toys & Games" },
  ];

  function $(id) { return document.getElementById(id); }

  // ✅ 关键：逐段编码，解决空格、逗号、& 等字符
  function encodePath(path) {
    return String(path).split('/').map(seg => encodeURIComponent(seg)).join('/');
  }

  function getParam(name) {
    const u = new URL(location.href);
    return u.searchParams.get(name);
  }
  function setParam(name, value) {
    const u = new URL(location.href);
    u.searchParams.set(name, value);
    history.replaceState({}, "", u.toString());
  }

  function getCurrentCategory() {
    const catKey = getParam("cat") || CATEGORIES[0]?.key;
    return CATEGORIES.find(x => x.key === catKey) || CATEGORIES[0];
  }

  // ---------------- CSV 解析（自动识别分隔符，兼容 BOM） ----------------
  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, '');
    const firstLine = (text.split(/\r?\n/).find(l => l.trim().length) || '');
    const candidates = [',', ';', '\t'];
    let sep = ',', best = -1;

    for (const c of candidates) {
      const re = c === '\t' ? /\t/g : new RegExp('\\' + c, 'g');
      const count = (firstLine.match(re) || []).length;
      if (count > best) { best = count; sep = c; }
    }

    const rows = [];
    let row = [], cur = '', inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const n = text[i + 1];

      if (ch === '"' && inQuotes && n === '"') { cur += '"'; i++; continue; }
      if (ch === '"') { inQuotes = !inQuotes; continue; }

      if (ch === sep && !inQuotes) { row.push(cur); cur = ''; continue; }

      if (!inQuotes && (ch === '\n' || ch === '\r')) {
        if (ch === '\r' && n === '\n') i++;
        if (cur.length || row.length) { row.push(cur); rows.push(row); }
        cur = ''; row = [];
        continue;
      }

      cur += ch;
    }

    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  }

  function toNum(v) {
    const n = Number(String(v).replace(/,/g,'').replace(/\s/g,'').replace(/[^\d.]/g,''));
    return Number.isFinite(n) ? n : 0;
  }

  function normalizeHeader(h) {
    return String(h || '').replace(/^\uFEFF/, '').trim().toLowerCase();
  }

  // ---------------- 图片兜底：JPG -> PNG -> 占位图 ----------------
  function placeholderSvg(text = 'NO IMAGE') {
    const esc = (s) => String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&apos;');

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
      <rect width="260" height="260" fill="#f2f2f2"/>
      <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
            fill="#999" font-size="16" font-family="Arial, sans-serif">${esc(text)}</text>
    </svg>`;
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }

  function imagePath(asin, ext) {
    const cat = getCurrentCategory();
    const safeAsin = encodeURIComponent(asin);
    const dir = encodePath(cat.imgDir); // ✅ 目录逐段编码（解决 &）
    return `${dir}/${safeAsin}.${ext}`;
  }

  function warnOnce(key, msg) {
    window.__warned ||= new Set();
    if (window.__warned.has(key)) return;
    window.__warned.add(key);
    console.warn(msg);
  }

  function handleImageError(img) {
    const asin = img.dataset.asin || '';

    if (img.dataset.fallback === 'jpg') {
      img.dataset.fallback = 'png';
      img.src = imagePath(asin, 'png');
      warnOnce(`img:${asin}:jpg`, `[image] missing JPG -> try PNG: ${asin}`);
      return;
    }

    if (img.dataset.fallback === 'png') {
      img.dataset.fallback = 'placeholder';
      img.src = placeholderSvg('NO IMAGE');
      warnOnce(`img:${asin}:png`, `[image] missing PNG -> placeholder: ${asin}`);
      return;
    }
  }

  // ---------------- 页面状态 & 渲染 ----------------
  let all = [];
  let page = 1;

  function initCategorySelect() {
    const sel = $('cat');
    sel.innerHTML = '';

    for (const c of CATEGORIES) {
      const opt = document.createElement('option');
      opt.value = c.key;
      opt.textContent = c.name;
      sel.appendChild(opt);
    }

    const cur = getCurrentCategory();
    sel.value = cur.key;
    $('title').textContent = `亚马逊新品 · ${cur.name}`;

    sel.addEventListener('change', () => {
      setParam("cat", sel.value);
      page = 1;
      load();
    });
  }

  async function load() {
    const cat = getCurrentCategory();
    try {
      $('hint').textContent = '';
      $('stat').textContent = '加载中...';
      $('title').textContent = `亚马逊新品 · ${cat.name}`;

      // ✅ CSV 路径逐段编码（解决空格、&）
      const url = encodePath(cat.csv) + '?v=' + Date.now();
      const res = await fetch(url);

      if (!res.ok) {
        $('stat').innerHTML = `<span class="danger">加载失败：${res.status}</span>`;
        $('hint').innerHTML = `<span class="danger">请确认存在：${cat.csv}（CSV 文本）</span>`;
        console.error('[csv] fetch failed', res.status, res.statusText, url);
        return;
      }

      const text = await res.text();
      const table = parseCSV(text);

      if (!table.length) {
        $('stat').innerHTML = `<span class="danger">CSV 为空</span>`;
        $('hint').innerHTML = `<span class="danger">请检查：${cat.csv}</span>`;
        return;
      }

      const header = table[0].map(h => String(h).replace(/^\uFEFF/, '').trim());
      const headerNorm = header.map(normalizeHeader);

      const idxASIN =
        headerNorm.findIndex(h => h === 'asin') !== -1
          ? headerNorm.findIndex(h => h === 'asin')
          : headerNorm.findIndex(h => h.includes('asin'));

      const idxSales =
        headerNorm.findIndex(h => h === '月销量') !== -1
          ? headerNorm.findIndex(h => h === '月销量')
          : headerNorm.findIndex(h => h.includes('月销量') || h.includes('monthly') || h.includes('sales'));

      if (idxASIN === -1 || idxSales === -1) {
        $('stat').innerHTML = `<span class="danger">表头不匹配</span>`;
        $('hint').innerHTML = `<span class="danger">CSV 表头必须包含：ASIN 和 月销量</span>`;
        console.error('[csv] headers:', header);
        return;
      }

      all = table.slice(1).map(r => ({
        asin: (r[idxASIN] || '').trim(),
        monthlySales: toNum(r[idxSales])
      })).filter(x => x.asin);

      page = 1;
      render();
    } catch (e) {
      // ✅ 直接把具体错误显示出来
      const msg = (e && e.message) ? e.message : String(e);
      $('stat').innerHTML = `<span class="danger">加载异常：${msg}</span>`;
      $('hint').innerHTML = `<span class="danger">请看 Console / Network</span>`;
      console.error('[load] error', e);
    }
  }

  function getFiltered() {
    const q = $('q').value.trim().toLowerCase();
    let list = all;
    if (q) list = list.filter(x => x.asin.toLowerCase().includes(q));

    const sort = $('sort').value;
    list = [...list].sort((a, b) => {
      if (sort === 'salesDesc') return b.monthlySales - a.monthlySales;
      if (sort === 'salesAsc') return a.monthlySales - b.monthlySales;
      if (sort === 'asinAsc') return a.asin.localeCompare(b.asin);
      if (sort === 'asinDesc') return b.asin.localeCompare(a.asin);
      return 0;
    });
    return list;
  }

  function render() {
    const list = getFiltered();
    const size = Number($('pageSize').value) || 100;
    const total = list.length;
    const pages = Math.max(1, Math.ceil(total / size));
    page = Math.min(page, pages);

    const start = (page - 1) * size;
    const view = list.slice(start, start + size);

    $('stat').textContent = `共 ${total} 个`;
    $('pageInfo').textContent = `第 ${page} / ${pages} 页（每页 ${size}）`;

    const grid = $('grid');
    grid.innerHTML = '';

    for (const x of view) {
      const asin = x.asin;
      const url = `https://www.amazon.com/dp/${encodeURIComponent(asin)}`;

      const card = document.createElement('div');
      card.className = 'card';

      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener';

      const imgBox = document.createElement('div');
      imgBox.className = 'imgbox';

      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = asin;
      img.dataset.asin = asin;
      img.dataset.fallback = 'jpg';
      img.src = imagePath(asin, 'jpg');
      img.onerror = () => handleImageError(img);

      imgBox.appendChild(img);
      link.appendChild(imgBox);
      card.appendChild(link);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `
        <div class="asin">ASIN：${asin}</div>
        <div class="sales">月销量：${x.monthlySales.toLocaleString()}</div>
        <div><a href="${url}" target="_blank" rel="noopener">打开亚马逊</a></div>
      `;
      card.appendChild(meta);

      grid.appendChild(card);
    }
  }

  // ---------------- 事件 ----------------
  $('q').addEventListener('input', () => { page = 1; render(); });
  $('sort').addEventListener('change', () => { page = 1; render(); });
  $('pageSize').addEventListener('change', () => { page = 1; render(); });
  $('prev').addEventListener('click', () => { page = Math.max(1, page - 1); render(); });
  $('next').addEventListener('click', () => { page = page + 1; render(); });
  $('reload').addEventListener('click', () => load());

  // 初次加载
  initCategorySelect();
  load();
</script>
</body>
</html>
