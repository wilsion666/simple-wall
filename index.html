<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>亚马逊新品 - 产品分类</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #fafafa; 
      padding: 20px; 
      margin: 0;
    }
    
    h2 { 
      margin: 0 0 12px; 
      font-size: 24px;
    }
    
    .top-actions { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      align-items: center; 
      margin-bottom: 12px; 
    }
    
    .nav-btn { 
      padding: 8px 10px; 
      border: 1px solid #ddd; 
      border-radius: 10px; 
      background: #fff; 
      text-decoration: none; 
      color: #333; 
      cursor: pointer;
    }
    
    .nav-btn.primary { 
      background: #111; 
      color: #fff; 
      border-color: #111; 
    }
    
    .dropdown { position: relative; display: inline-block; }
    .dropdown .nav-btn { cursor: pointer; }
    .dropdown-content { display: none; position: absolute; background-color: #fff; min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,.1); border-radius: 8px; z-index: 1000; border: 1px solid #ddd; margin-top: 4px; }
    .dropdown-content a { color: #333; padding: 10px 16px; text-decoration: none; display: block; border-radius: 0; }
    .dropdown-content a:first-child { border-radius: 8px 8px 0 0; }
    .dropdown-content a:last-child { border-radius: 0 0 8px 8px; }
    .dropdown-content a:hover { background-color: #f5f5f5; }
    .dropdown:hover .dropdown-content { display: block; }
    
    .bar { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      align-items: center; 
      margin: 10px 0 16px; 
    }
    
    input, select, button { 
      padding: 8px 10px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      background: #fff; 
      font-size: 14px;
    }
    
    button { 
      cursor: pointer; 
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    select {
      min-width: 200px;
    }
    
    .muted { 
      color: #666; 
      font-size: 13px; 
    }
    
    .pill { 
      padding: 6px 10px; 
      border: 1px solid #eee; 
      border-radius: 999px; 
      background: #fff; 
    }
    
    .danger { 
      color: #b00020; 
    }
    
    .wrap { 
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .card { 
      background: #fff; 
      border-radius: 12px; 
      padding: 12px; 
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      display: flex;
      flex-direction: column;
    }

      border-radius: 10px; 
      overflow: hidden; 
      background: #f2f2f2;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .imgbox img { 
      width: 100%; 
      height: 100%;
      object-fit: cover;
      display: block; 
    }
    
    .meta { 
      margin-top: 10px; 
      font-size: 14px; 
      line-height: 1.6;

      flex-direction: column;
    }

    }

    .pager {

    /* Modal 样式 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;

    .modal-content {

    .verdict-badge {

    /* Listing 结果样式 */
    .listing-result .result-section {

    .nav-item-to-hide { transition: opacity 0.3s, visibility 0.3s; }

<body>
  <div class="top-actions">
    <a class="nav-btn primary" href="/">去看亚马逊新品</a>
    <a class="nav-btn nav-item-to-hide" href="/articles/">产品开发系列</a>
    <a class="nav-btn nav-item-to-hide" href="/pages/1688.html">1688</a>
    <a class="nav-btn nav-item-to-hide" href="/pages/tiktok.html">TikTok</a>
  </div>

  <h2>亚马逊新品 - 产品分类</h2>

  <div class="bar">
    <select id="categorySelect">
      <option value="all">加载中...</option>
    </select>

    <input id="searchInput" placeholder="搜索 ASIN" style="min-width:220px;" />
    
    <select id="sortSelect">
      <option value="salesDesc">按月销量：高→低</option>
      <option value="salesAsc">按月销量：低→高</option>
      <option value="asinAsc">按 ASIN：A→Z</option>
      <option value="asinDesc">按 ASIN：Z→A</option>
    </select>

    <select id="pageSizeSelect">
      <option value="50">每页 50</option>
      <option value="100" selected>每页 100</option>
      <option value="200">每页 200</option>
    </select>

    <span class="muted pill" id="statusText">未加载</span>
    <span class="muted danger" id="errorText"></span>
  </div>

  <div class="wrap" id="productGrid"></div>

  <div class="pager">
    <button id="prevBtn">上一页</button>
    <span class="muted" id="pageInfo"></span>
    <button id="nextBtn">下一页</button>
  </div>

  <!-- Modal 弹窗 -->
  <div id="actionModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">功能标题</h3>
        <span class="close">&times;</span>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- 动态内容 -->
      </div>
    </div>
  </div>

<script>
  // ============================================================
  // 全局状态
  // ============================================================
  let allProducts = [];           // 所有产品（去重后）
  let categoryStats = {};         // 类目统计 { categoryName: count }
  let currentPage = 1;
  let currentCategory = 'all';

  // ============================================================
  // 工具函数
  // ============================================================
  function $(id) { 
    return document.getElementById(id); 
  }

  // CSV 解析（支持引号、换行、BOM）
  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, ''); // 移除 BOM
    
    const rows = [];
    let row = [];
    let cell = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"' && inQuotes && nextChar === '"') {
        cell += '"';
        i++;
        continue;
      }

      if (char === '"') {
        inQuotes = !inQuotes;
        continue;
      }

      if (char === ',' && !inQuotes) {
        row.push(cell);
        cell = '';
        continue;
      }

      if (!inQuotes && (char === '\n' || char === '\r')) {
        if (char === '\r' && nextChar === '\n') i++;
        if (cell.length || row.length) {
          row.push(cell);
          rows.push(row);
        }
        cell = '';
        row = [];
        continue;
      }

      cell += char;
    }

    if (cell.length || row.length) {
      row.push(cell);
      rows.push(row);
    }

    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  }

  // 数字解析
  function parseNumber(value) {
    const str = String(value).replace(/,/g, '').replace(/\s/g, '').replace(/[^\d.-]/g, '');
    const num = Number(str);
    return Number.isFinite(num) ? num : 0;
  }

  // 占位图
  function placeholderSvg(text = 'NO IMAGE') {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
      <rect width="260" height="260" fill="#f2f2f2"/>
      <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
            fill="#999" font-size="16" font-family="Arial, sans-serif">${text}</text>
    </svg>`;
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }

  // ============================================================
  // 数据加载
  // ============================================================
  async function loadData() {
    try {
      $('statusText').textContent = '加载中...';
      $('errorText').textContent = '';

      // 并行加载两个 CSV
      const [text1, text2] = await Promise.all([
        fetch('/data/csv/1.19-500.csv?v=' + Date.now()).then(r => { if (!r.ok) throw new Error('1.19-500 加载失败: ' + r.status); return r.text(); }),
        fetch('/data/csv/1.24-简化版.csv?v=' + Date.now()).then(r => { if (!r.ok) throw new Error('1.24-简化版 加载失败: ' + r.status); return r.text(); })
      ]);

      const productMap = new Map(); // 按 ASIN 去重，同 ASIN 时 1.24 覆盖 1.19
      const requiredFields = ['ASIN', '小类目', '月销量', '毛利率'];

      function addCSVToMap(text, name) {
        const rows = parseCSV(text);
        if (rows.length === 0) return;
        const headers = rows[0].map(h => h.trim());
        const headerMap = {};
        headers.forEach((h, i) => { headerMap[h] = i; });
        for (const f of requiredFields) {
          if (!(f in headerMap)) throw new Error(name + ' 缺少必需字段: ' + f);
        }
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const asin = (row[headerMap['ASIN']] || '').trim();
          if (!asin) continue;
          const categoryText = (row[headerMap['小类目']] || '').trim();
          const categories = categoryText.split('\n').map(c => c.trim()).filter(c => c);
          const product = {
            asin: asin,
            image: (row[headerMap['商品主图']] || '').trim(),
            title: (row[headerMap['商品标题']] || '').trim(),
            detailUrl: (row[headerMap['商品详情页链接']] || '').trim(),
            smallCategory: categories[0] || '',
            allCategories: categories,
            monthlySales: parseNumber(row[headerMap['月销量']] || 0),
            grossMargin: (row[headerMap['毛利率']] || '').trim(),
            price: (row[headerMap['价格($)']] || '').trim()
          };
          productMap.set(asin, product);
        }
      }

      addCSVToMap(text1, '1.19-500.csv');
      addCSVToMap(text2, '1.24-简化版.csv');

      if (productMap.size === 0) {
        throw new Error('两个 CSV 均无有效产品数据');
      }

      allProducts = Array.from(productMap.values());

      // 统计类目
      categoryStats = {};
      allProducts.forEach(product => {
        // 为每个产品的所有类目计数
        product.allCategories.forEach(cat => {
          if (cat) {
            categoryStats[cat] = (categoryStats[cat] || 0) + 1;
          }
        });
      });

      // 过滤：只保留 ASIN >= 7 的类目
      const validCategories = Object.entries(categoryStats)
        .filter(([_, count]) => count >= 7)
        .sort((a, b) => b[1] - a[1]); // 按数量降序

      // 构建下拉选项
      const categorySelect = $('categorySelect');
      categorySelect.innerHTML = '';

      // 添加 "all" 选项
      const allOption = document.createElement('option');
      allOption.value = 'all';
      allOption.textContent = `all (${allProducts.length})`;
      categorySelect.appendChild(allOption);

      // 添加类目选项
      validCategories.forEach(([category, count]) => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = `${category} (${count})`;
        categorySelect.appendChild(option);
      });

      $('statusText').textContent = `共 ${allProducts.length} 个产品`;
      
      // 渲染产品
      renderProducts();

    } catch (error) {
      console.error('[loadData] error:', error);
      $('statusText').textContent = '加载失败';
      $('errorText').textContent = error.message;
      $('productGrid').innerHTML = '';
    }
  }

  // ============================================================
  // 产品过滤与排序
  // ============================================================
  function getFilteredProducts() {
    let filtered = allProducts;

    // 按类目过滤
    if (currentCategory !== 'all') {
      filtered = filtered.filter(p => p.allCategories.includes(currentCategory));
    }

    // 按 ASIN 搜索
    const searchTerm = $('searchInput').value.trim().toLowerCase();
    if (searchTerm) {
      filtered = filtered.filter(p => p.asin.toLowerCase().includes(searchTerm));
    }

    // 排序
    const sortValue = $('sortSelect').value;
    filtered = [...filtered].sort((a, b) => {
      switch (sortValue) {
        case 'salesDesc': return b.monthlySales - a.monthlySales;
        case 'salesAsc': return a.monthlySales - b.monthlySales;
        case 'asinAsc': return a.asin.localeCompare(b.asin);
        case 'asinDesc': return b.asin.localeCompare(a.asin);
        default: return 0;
      }
    });

    return filtered;
  }

  // ============================================================
  // 产品渲染
  // ============================================================
  function renderProducts() {
    const filtered = getFilteredProducts();
    const pageSize = Number($('pageSizeSelect').value) || 100;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    
    // 确保当前页在有效范围内
    currentPage = Math.min(currentPage, totalPages);
    currentPage = Math.max(1, currentPage);

    const startIndex = (currentPage - 1) * pageSize;
    const endIndex = startIndex + pageSize;
    const pageProducts = filtered.slice(startIndex, endIndex);

    // 更新状态信息
    $('statusText').textContent = `共 ${filtered.length} 个产品`;
    $('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 页`;

    // 渲染产品卡片
    const grid = $('productGrid');
    grid.innerHTML = '';

    if (pageProducts.length === 0) {
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#999;">暂无产品数据</div>';
      return;
    }

    pageProducts.forEach(product => {
      const card = createProductCard(product);
      grid.appendChild(card);
    });

    // 更新分页按钮状态
    $('prevBtn').disabled = currentPage <= 1;
    $('nextBtn').disabled = currentPage >= totalPages;
  }

  // ============================================================

  // ============================================================

        img.src = placeholderSvg('加载失败');
      };
    } else {
      img.src = placeholderSvg('暂无图片');
    }

    imgBox.appendChild(img);
    card.appendChild(imgBox);

    // 产品信息
    const meta = document.createElement('div');
    meta.className = 'meta';

    const asinDiv = document.createElement('div');
    asinDiv.className = 'asin';
    asinDiv.textContent = `ASIN: ${product.asin}`;
    meta.appendChild(asinDiv);

    salesDiv.className = 'sales';

    marginDiv.className = 'margin';
    marginDiv.innerHTML = `<strong>毛利率:</strong> ${product.grossMargin}`;
    meta.appendChild(marginDiv);

    const priceDiv = document.createElement('div');
    priceDiv.className = 'price';
    priceDiv.innerHTML = `<strong>价格:</strong> $${product.price}`;
    meta.appendChild(priceDiv);

    const amazonUrl = product.detailUrl || `https://www.amazon.com/dp/${product.asin}`;
    const amazonLink = document.createElement('a');

    amazonLink.href = amazonUrl;
    amazonLink.target = '_blank';
    amazonLink.rel = 'noopener noreferrer';

      { text: '生成listing', action: 'generateListing' },

      console.log('[DEBUG] 触发利润计算，action:', action);
      console.log('[DEBUG] 产品数据:', product);

        modalBody.innerHTML = '<p style="color:red;">错误：利润计算函数未加载</p>';

  // ============================================================
  // 生成 Listing AI 调用
  // ============================================================
  async function generateListingWithAI(product, container) {
    console.log('[generateListingWithAI] 开始调用 API');
    console.log('[generateListingWithAI] 产品信息:', {
      asin: product.asin,
      title: product.title,
      imageUrl: product.image
    });

    try {
      const requestBody = {
        title: product.title,
        imageUrl: product.image || '',  // 确保有值，即使是空字符串
        asin: product.asin
      };
      
      console.log('[generateListingWithAI] 发送请求到 /api/generate-listing');
      console.log('[generateListingWithAI] 请求体:', requestBody);
      
      const response = await fetch('/api/generate-listing', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
      });
      
      console.log('[generateListingWithAI] 收到响应，状态码:', response.status);
      
      const data = await response.json();
      console.log('[generateListingWithAI] 响应数据:', data);
      
      if (!response.ok) {
        const errorMsg = data.error || data.message || '生成失败';
        console.error('[generateListingWithAI] API 返回错误:', errorMsg);
        console.error('[generateListingWithAI] 错误详情:', data);
        throw new Error(errorMsg);
      }
      
      console.log('[generateListingWithAI] ✅ 成功生成 Listing');
      
      // 渲染结果
      renderListingResult(container, data.listing, product);
      
    } catch (error) {
      console.error('[generateListingWithAI] ❌ 捕获错误:', error);
      console.error('[generateListingWithAI] 错误堆栈:', error.stack);
      
      container.innerHTML = `
        <div class="field"><strong>ASIN:</strong> ${product.asin}</div>
        <div class="ai-output">
          <h4 style="color:#dc2626;">❌ 生成失败</h4>

          <p style="color:#666; font-size:12px; margin-top:10px;">
            请查看浏览器控制台（F12）了解详细错误信息
          </p>
        </div>
      `;
    }
  }

  // ============================================================
  // 利润计算逻辑
  // ============================================================
  function setupProfitCalc(uid, priceUsd, marginPct) {
    const inputs = {
      productCost: $(`${uid}_productCost`),
      shippingCost: $(`${uid}_shippingCost`),
      fx: $(`${uid}_fx`),
      adPct: $(`${uid}_adPct`),
      refundPct: $(`${uid}_refundPct`)
    };
    const output = $(`${uid}_output`);

    if (!output) return;

    // 计算并更新UI
    function calculate() {
      // 输入验证：确保非负且在合理范围内
      const productCostRmb = Math.max(0, parseFloat(inputs.productCost.value) || 0);
      const shippingCostRmb = Math.max(0, parseFloat(inputs.shippingCost.value) || 0);
      const fx = Math.max(0.01, parseFloat(inputs.fx.value) || 7.1);
      const adPct = Math.max(0, Math.min(1, (parseFloat(inputs.adPct.value) || 0) / 100));
      const refundPct = Math.max(0, Math.min(1, (parseFloat(inputs.refundPct.value) || 0) / 100));

      // 检查是否有有效输入（检查输入框是否为空，而不是值是否为0）
      const hasInput = inputs.productCost.value.trim() || inputs.shippingCost.value.trim() || 
                      inputs.adPct.value.trim() || inputs.refundPct.value.trim();
      if (!hasInput) {
        output.className = 'profit-placeholder';
        output.innerHTML = '<p>请输入成本信息开始计算</p>';
        return;
      }

      // 调用计算函数
      const result = calcProfitMetrics({
        priceUsd,
        asinMarginPct: marginPct,
        productCostRmb,
        shippingCostRmb,
        fx,
        adPct,
        refundPct
      });

      // 错误处理：显示具体错误信息
      if (!result || result.error) {
        output.className = 'profit-placeholder';
        const errorMsg = result?.error || '未知错误';
        output.innerHTML = `<p style="color:#dc2626;">计算失败：${errorMsg}</p>`;
        return;
      }

      // 渲染结果
      renderProfitResult(output, result, priceUsd);
    }

    // 防抖函数
    let timer = null;
    function debounceCalculate() {
      clearTimeout(timer);
      timer = setTimeout(calculate, 200);
    }

    // 绑定事件
    Object.values(inputs).forEach(input => {
      if (input) {
        input.addEventListener('input', debounceCalculate);
      }
    });

    // 初始计算（如果汇率已有值）
    calculate();
  }

  // ============================================================
  // 渲染利润计算结果
  // ============================================================
  function renderProfitResult(container, result, priceUsd) {
    // 决策徽章类名
    let verdictClass = 'verdict-fail';
    let verdictText = '❌ 不做 - 利润率过低';
    
    if (result.verdict === '✅ 做') {
      verdictClass = 'verdict-success';
      verdictText = '✅ 做 - 利润率良好';
    } else if (result.verdict === '⚠️ 讨论') {
      verdictClass = 'verdict-warning';
      verdictText = '⚠️ 讨论 - 利润率一般';
    }

    // 利润颜色（与决策逻辑保持一致）
    const profitClass = result.profitPct >= 0.15 ? 'value-positive' : 
                       result.profitPct > 0.12 ? 'value-warning' : 'value-negative';

    // 计算广告费和退款费占比
    const adPct = priceUsd > 0 ? result.adUsd / priceUsd : 0;
    const refundPctCalc = priceUsd > 0 ? result.refundUsd / priceUsd : 0;

    container.className = 'profit-output';
    container.innerHTML = `
      <!-- 成本结构 -->
      <div class="output-section">
        <h4>成本结构</h4>
        <div class="cost-list">
          <div class="cost-item">
            <span class="cost-label">• 产品成本占比</span>
            <span class="cost-value">
              <span class="pct">${formatPct(result.productCostPct)}</span>
              <span class="usd">(${formatUsd(result.productCostUsd)})</span>
            </span>
          </div>
          <div class="cost-item">
            <span class="cost-label">• 物流成本占比</span>
            <span class="cost-value">
              <span class="pct">${formatPct(result.shippingCostPct)}</span>
              <span class="usd">(${formatUsd(result.shippingCostUsd)})</span>
            </span>
          </div>
          <div class="cost-item">
            <span class="cost-label">• 广告费</span>
            <span class="cost-value">
              <span class="pct">${formatPct(adPct)}</span>
              <span class="usd">(${formatUsd(result.adUsd)})</span>
            </span>
          </div>
          <div class="cost-item">
            <span class="cost-label">• 退款费</span>
            <span class="cost-value">
              <span class="pct">${formatPct(refundPctCalc)}</span>
              <span class="usd">(${formatUsd(result.refundUsd)})</span>
            </span>
          </div>
        </div>
      </div>
      
      <!-- Amazon毛利 -->
      <div class="output-section">
        <h4>Amazon费用后</h4>
        <div class="margin-item">
          <span>毛利额</span>
          <span class="value-positive">${formatUsd(result.amazonMarginUsd)} (${formatPct(result.amazonMarginPct)})</span>
        </div>
      </div>
      
      <!-- 最终利润 -->
      <div class="profit-final">
        <div class="final-label">🎯 最终利润</div>
        <div class="final-value ${profitClass}">
          <span class="usd">${formatUsd(result.profitUsd)}</span>
          <span class="pct">(${formatPct(result.profitPct)})</span>
        </div>
      </div>
      
      <!-- 决策建议 -->
      <div class="verdict-badge ${verdictClass}">
        ${verdictText}
      </div>
    `;
  }
