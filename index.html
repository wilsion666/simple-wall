<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>新品观察墙</title>
  <style>
    body { font-family: Arial, sans-serif; background:#fafafa; padding:20px; }
    h2 { margin: 0 0 12px; }
    .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin: 10px 0 16px; }
    input, select, button { padding:8px 10px; border:1px solid #ddd; border-radius:8px; background:#fff; }
    button { cursor:pointer; }
    .wrap { display:flex; gap:16px; flex-wrap:wrap; align-items:stretch; }
    .card { width:260px; background:#fff; border-radius:12px; padding:10px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .imgbox { border-radius:10px; overflow:hidden; background:#f2f2f2; }
    img { width:100%; display:block; }
    .meta { margin-top:8px; font-size:14px; line-height:1.6; }
    .asin { font-weight:700; }
    .sales { font-weight:700; }
    a { color:#0066cc; text-decoration:none; }
    .pager { margin-top:16px; display:flex; gap:10px; align-items:center; }
    .muted { color:#666; font-size:13px; }
  </style>
</head>
<body>
  <h2>新品观察墙</h2>

  <div class="bar">
    <input id="q" placeholder="搜索 ASIN" style="min-width:220px;" />
    <select id="sort">
      <option value="salesDesc">按月销量：高→低</option>
      <option value="salesAsc">按月销量：低→高</option>
      <option value="asinAsc">按 ASIN：A→Z</option>
      <option value="asinDesc">按 ASIN：Z→A</option>
    </select>
    <select id="pageSize">
      <option value="50">每页 50</option>
      <option value="100" selected>每页 100</option>
      <option value="200">每页 200</option>
    </select>
    <span class="muted" id="stat"></span>
  </div>

  <div class="wrap" id="grid"></div>

  <div class="pager">
    <button id="prev">上一页</button>
    <span class="muted" id="pageInfo"></span>
    <button id="next">下一页</button>
  </div>

<script>
  // --- 解析 CSV：自动识别分隔符（逗号/分号/Tab）+ 兼容 BOM ---
  function parseCSV(text) {
    // 去掉 UTF-8 BOM
    text = text.replace(/^\uFEFF/, '');

    // 自动判断分隔符：逗号/分号/Tab
    const firstLine = text.split(/\r?\n/).find(l => l.trim().length) || '';
    const candidates = [',', ';', '\t'];
    let sep = ',';
    let best = -1;

    for (const c of candidates) {
      const re = c === '\t' ? /\t/g : new RegExp('\\' + c, 'g');
      const count = (firstLine.match(re) || []).length;
      if (count > best) { best = count; sep = c; }
    }

    const rows = [];
    let row = [], cur = '', inQuotes = false;

    for (let i=0; i<text.length; i++) {
      const ch = text[i], n = text[i+1];

      if (ch === '"' && inQuotes && n === '"') { cur += '"'; i++; continue; }
      if (ch === '"') { inQuotes = !inQuotes; continue; }

      if (ch === sep && !inQuotes) { row.push(cur); cur = ''; continue; }

      if ((ch === '\n' || ch === '\r') && !inQuotes) {
        if (cur.length || row.length) { row.push(cur); rows.push(row); }
        cur = ''; row = [];
        continue;
      }
      cur += ch;
    }

    if (cur.length || row.length) { row.push(cur); rows.push(row); }

    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  }

  function toNum(v) {
    // 兼容 "6,013" 这种带逗号的数字
    const n = Number(String(v).replace(/,/g,'').replace(/[^\d.]/g,''));
    return Number.isFinite(n) ? n : 0;
  }

  let all = [];
  let page = 1;

  async function load() {
    // 这里读取你仓库里的 CSV 文件名（你现在是 men sunglasses-top10.csv）
    // 如果你以后改成 products.csv，这里也可以改回 products.csv
    const res = await fetch('men%20sunglasses-top10.csv?v=' + Date.now());
    const text = await res.text();
    const table = parseCSV(text);

    const header = table[0].map(h => String(h).replace(/^\uFEFF/, '').trim());
    const idx = (name) => header.findIndex(h => h === name);

    const iASIN = idx('ASIN');
    const iSales = idx('月销量');

    if (iASIN === -1 || iSales === -1) {
      alert('CSV 表头必须包含：ASIN, 月销量（注意：CSV 分隔符要正确，已支持逗号/分号/Tab）');
      return;
    }

    all = table.slice(1).map(r => ({
      asin: (r[iASIN] || '').trim(),
      monthlySales: toNum(r[iSales])
    })).filter(x => x.asin);

    render();
  }

  function getFiltered() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    let list = all;

    if (q) list = list.filter(x => x.asin.toLowerCase().includes(q));

    const sort = document.getElementById('sort').value;
    list = [...list].sort((a,b) => {
      if (sort === 'salesDesc') return b.monthlySales - a.monthlySales;
      if (sort === 'salesAsc') return a.monthlySales - b.monthlySales;
      if (sort === 'asinAsc') return a.asin.localeCompare(b.asin);
      if (sort === 'asinDesc') return b.asin.localeCompare(a.asin);
      return 0;
    });

    return list;
  }

  function render() {
    const list = getFiltered();
    const size = Number(document.getElementById('pageSize').value) || 100;
    const total = list.length;
    const pages = Math.max(1, Math.ceil(total / size));
    page = Math.min(page, pages);

    const start = (page - 1) * size;
    const view = list.slice(start, start + size);

    document.getElementById('stat').textContent = `共 ${total} 个`;
    document.getElementById('pageInfo').textContent = `第 ${page} / ${pages} 页（每页 ${size}）`;

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    for (const x of view) {
      const url = `https://www.amazon.com/dp/${x.asin}`;

      // 你当前图片在仓库根目录，所以直接用 `${ASIN}.jpg`
      // 如果你以后把图片放进 images 文件夹，再改成 `images/${x.asin}.jpg`
      const imgJpg = `${x.asin}.jpg`;
      const imgPng = `${x.asin}.png`;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <a href="${url}" target="_blank" rel="noopener">
          <div class="imgbox">
            <img.src = `./images/${asin}.jpg`;" loading="lazy" alt="${x.asin}"
                 onerror="this.onerror=null; this.src='/images/${asin}.jpg';">
          </div>
        </a>
        <div class="meta">
          <div class="asin">ASIN：${x.asin}</div>
          <div class="sales">月销量：${x.monthlySales.toLocaleString()}</div>
          <div><a href="${url}" target="_blank" rel="noopener">打开亚马逊</a></div>
        </div>
      `;
      grid.appendChild(card);
    }
  }

  document.getElementById('q').addEventListener('input', () => { page = 1; render(); });
  document.getElementById('sort').addEventListener('change', () => { page = 1; render(); });
  document.getElementById('pageSize').addEventListener('change', () => { page = 1; render(); });

  document.getElementById('prev').addEventListener('click', () => { page = Math.max(1, page - 1); render(); });
  document.getElementById('next').addEventListener('click', () => { page = page + 1; render(); });

  load();
</script>
</body>
</html>
