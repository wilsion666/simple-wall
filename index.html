<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>亚马逊新品 - 产品分类</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #fafafa; 
      padding: 20px; 
      margin: 0;
    }
    
    h2 { 
      margin: 0 0 12px; 
      font-size: 24px;
    }
    
    .top-actions { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      align-items: center; 
      margin-bottom: 12px; 
    }
    
    .nav-btn { 
      padding: 8px 10px; 
      border: 1px solid #ddd; 
      border-radius: 10px; 
      background: #fff; 
      text-decoration: none; 
      color: #333; 
      cursor: pointer;
    }
    
    .nav-btn.primary { 
      background: #111; 
      color: #fff; 
      border-color: #111; 
    }
    
    .dropdown { position: relative; display: inline-block; }
    .dropdown .nav-btn { cursor: pointer; }
    .dropdown-content { display: none; position: absolute; background-color: #fff; min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,.1); border-radius: 8px; z-index: 1000; border: 1px solid #ddd; margin-top: 4px; }
    .dropdown-content a { color: #333; padding: 10px 16px; text-decoration: none; display: block; border-radius: 0; }
    .dropdown-content a:first-child { border-radius: 8px 8px 0 0; }
    .dropdown-content a:last-child { border-radius: 0 0 8px 8px; }
    .dropdown-content a:hover { background-color: #f5f5f5; }
    .dropdown:hover .dropdown-content { display: block; }
    
    .bar { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      align-items: center; 
      margin: 10px 0 16px; 
    }
    
    input, select, button { 
      padding: 8px 10px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      background: #fff; 
      font-size: 14px;
    }
    
    button { 
      cursor: pointer; 
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    select {
      min-width: 200px;
    }
    
    .muted { 
      color: #666; 
      font-size: 13px; 
    }
    
    .pill { 
      padding: 6px 10px; 
      border: 1px solid #eee; 
      border-radius: 999px; 
      background: #fff; 
    }
    
    .danger { 
      color: #b00020; 
    }
    
    .wrap { 
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .card { 
      background: #fff; 
      border-radius: 12px; 
      padding: 12px; 
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      display: flex;
      flex-direction: column;
    }
    
    .imgbox { 
      border-radius: 10px; 
      overflow: hidden; 
      background: #f2f2f2;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .imgbox img { 
      width: 100%; 
      height: 100%;
      object-fit: cover;
      display: block; 
    }
    
    .meta { 
      margin-top: 10px; 
      font-size: 14px; 
      line-height: 1.6;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    
    .asin { 
      font-weight: 700; 
      margin-bottom: 4px;
    }
    
    .sales, .margin, .price { 
      color: #333;
      margin-bottom: 4px;
    }
    
    .sales strong, .margin strong, .price strong {
      font-weight: 700;
    }
    
    .amazon-link {
      display: inline-block;
      margin: 8px 0;
      padding: 6px 12px;
      background: #ff9900;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
    }
    
    .amazon-link:hover {
      background: #e68a00;
    }
    
    .action-buttons { 
      margin-top: auto;
      padding-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    
    .action-btn { 
      padding: 6px 8px; 
      border: 1px solid #0066cc; 
      border-radius: 6px; 
      background: #fff; 
      color: #0066cc; 
      text-decoration: none; 
      font-size: 12px; 
      cursor: pointer; 
      transition: all 0.2s;
      text-align: center;
    }
    
    .action-btn:hover { 
      background: #0066cc; 
      color: #fff; 
    }
    
    .action-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .pager { 
      margin-top: 16px; 
      display: flex; 
      gap: 10px; 
      align-items: center; 
      flex-wrap: wrap; 
    }
    
    /* Modal 样式 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
    }
    
    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    
    .modal-header h3 {
      margin: 0;
      font-size: 18px;
    }
    
    .close {
      color: #aaa;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
    }
    
    .close:hover,
    .close:focus {
      color: #000;
    }
    
    .modal-body {
      font-size: 14px;
      line-height: 1.6;
    }
    
    .modal-body .field {
      margin-bottom: 12px;
    }
    
    .modal-body .field strong {
      display: inline-block;
      width: 100px;
      color: #666;
    }
    
    .modal-body .ai-output {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      min-height: 100px;
    }
    
    .modal-body .ai-output h4 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #666;
    }

    .nav-item-to-hide { transition: opacity 0.3s, visibility 0.3s; }
    .nav-item-to-hide.hidden { display: none !important; }
  </style>
</head>

<body>
  <div class="top-actions">
    <a class="nav-btn primary" href="/">去看亚马逊新品</a>
    <a class="nav-btn nav-item-to-hide" href="/articles/">产品开发系列</a>
    <a class="nav-btn nav-item-to-hide" href="/pages/1688.html">1688</a>
    <a class="nav-btn nav-item-to-hide" href="/pages/tiktok.html">TikTok</a>
  </div>

  <h2>亚马逊新品 - 产品分类</h2>

  <div class="bar">
    <select id="categorySelect">
      <option value="all">加载中...</option>
    </select>

    <input id="searchInput" placeholder="搜索 ASIN" style="min-width:220px;" />
    
    <select id="sortSelect">
      <option value="salesDesc">按月销量：高→低</option>
      <option value="salesAsc">按月销量：低→高</option>
      <option value="asinAsc">按 ASIN：A→Z</option>
      <option value="asinDesc">按 ASIN：Z→A</option>
    </select>

    <select id="pageSizeSelect">
      <option value="50">每页 50</option>
      <option value="100" selected>每页 100</option>
      <option value="200">每页 200</option>
    </select>

    <span class="muted pill" id="statusText">未加载</span>
    <span class="muted danger" id="errorText"></span>
  </div>

  <div class="wrap" id="productGrid"></div>

  <div class="pager">
    <button id="prevBtn">上一页</button>
    <span class="muted" id="pageInfo"></span>
    <button id="nextBtn">下一页</button>
  </div>

  <!-- Modal 弹窗 -->
  <div id="actionModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">功能标题</h3>
        <span class="close">&times;</span>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- 动态内容 -->
      </div>
    </div>
  </div>

<script>
  // ============================================================
  // 全局状态
  // ============================================================
  let allProducts = [];           // 所有产品（去重后）
  let categoryStats = {};         // 类目统计 { categoryName: count }
  let currentPage = 1;
  let currentCategory = 'all';

  // ============================================================
  // 工具函数
  // ============================================================
  function $(id) { 
    return document.getElementById(id); 
  }

  // CSV 解析（支持引号、换行、BOM）
  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, ''); // 移除 BOM
    
    const rows = [];
    let row = [];
    let cell = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"' && inQuotes && nextChar === '"') {
        cell += '"';
        i++;
        continue;
      }

      if (char === '"') {
        inQuotes = !inQuotes;
        continue;
      }

      if (char === ',' && !inQuotes) {
        row.push(cell);
        cell = '';
        continue;
      }

      if (!inQuotes && (char === '\n' || char === '\r')) {
        if (char === '\r' && nextChar === '\n') i++;
        if (cell.length || row.length) {
          row.push(cell);
          rows.push(row);
        }
        cell = '';
        row = [];
        continue;
      }

      cell += char;
    }

    if (cell.length || row.length) {
      row.push(cell);
      rows.push(row);
    }

    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  }

  // 数字解析
  function parseNumber(value) {
    const str = String(value).replace(/,/g, '').replace(/\s/g, '').replace(/[^\d.-]/g, '');
    const num = Number(str);
    return Number.isFinite(num) ? num : 0;
  }

  // 占位图
  function placeholderSvg(text = 'NO IMAGE') {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
      <rect width="260" height="260" fill="#f2f2f2"/>
      <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
            fill="#999" font-size="16" font-family="Arial, sans-serif">${text}</text>
    </svg>`;
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }

  // ============================================================
  // 数据加载
  // ============================================================
  async function loadData() {
    try {
      $('statusText').textContent = '加载中...';
      $('errorText').textContent = '';

      const response = await fetch('/data/csv/1.19-500.csv?v=' + Date.now());
      
      if (!response.ok) {
        throw new Error(`加载失败: ${response.status} 请确认存在: data/csv/1.19-500.csv`);
      }

      const text = await response.text();
      const rows = parseCSV(text);

      if (rows.length === 0) {
        throw new Error('CSV 文件为空');
      }

      // 解析表头
      const headers = rows[0].map(h => h.trim());
      const headerMap = {};
      headers.forEach((h, i) => {
        headerMap[h] = i;
      });

      // 检查必需字段
      const requiredFields = ['ASIN', '小类目', '月销量', '毛利率'];
      for (const field of requiredFields) {
        if (!(field in headerMap)) {
          throw new Error(`CSV 缺少必需字段: ${field}`);
        }
      }

      // 解析产品数据
      const productMap = new Map(); // 用于按 ASIN 去重

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const asin = (row[headerMap['ASIN']] || '').trim();
        
        if (!asin) continue;

        // 处理小类目（可能有多行）
        const categoryText = (row[headerMap['小类目']] || '').trim();
        const categories = categoryText.split('\n').map(c => c.trim()).filter(c => c);
        
        const product = {
          asin: asin,
          image: (row[headerMap['商品主图']] || '').trim(),
          title: (row[headerMap['商品标题']] || '').trim(),
          detailUrl: (row[headerMap['商品详情页链接']] || '').trim(),
          smallCategory: categories[0] || '', // 取第一个类目
          allCategories: categories,          // 保存所有类目
          monthlySales: parseNumber(row[headerMap['月销量']] || 0),
          grossMargin: (row[headerMap['毛利率']] || '').trim(),
          price: (row[headerMap['价格($)']] || '').trim()
        };

        // 去重：保留最后一条
        productMap.set(asin, product);
      }

      allProducts = Array.from(productMap.values());

      // 统计类目
      categoryStats = {};
      allProducts.forEach(product => {
        // 为每个产品的所有类目计数
        product.allCategories.forEach(cat => {
          if (cat) {
            categoryStats[cat] = (categoryStats[cat] || 0) + 1;
          }
        });
      });

      // 过滤：只保留 ASIN >= 7 的类目
      const validCategories = Object.entries(categoryStats)
        .filter(([_, count]) => count >= 7)
        .sort((a, b) => b[1] - a[1]); // 按数量降序

      // 构建下拉选项
      const categorySelect = $('categorySelect');
      categorySelect.innerHTML = '';

      // 添加 "all" 选项
      const allOption = document.createElement('option');
      allOption.value = 'all';
      allOption.textContent = `all (${allProducts.length})`;
      categorySelect.appendChild(allOption);

      // 添加类目选项
      validCategories.forEach(([category, count]) => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = `${category} (${count})`;
        categorySelect.appendChild(option);
      });

      $('statusText').textContent = `共 ${allProducts.length} 个产品`;
      
      // 渲染产品
      renderProducts();

    } catch (error) {
      console.error('[loadData] error:', error);
      $('statusText').textContent = '加载失败';
      $('errorText').textContent = error.message;
      $('productGrid').innerHTML = '';
    }
  }

  // ============================================================
  // 产品过滤与排序
  // ============================================================
  function getFilteredProducts() {
    let filtered = allProducts;

    // 按类目过滤
    if (currentCategory !== 'all') {
      filtered = filtered.filter(p => p.allCategories.includes(currentCategory));
    }

    // 按 ASIN 搜索
    const searchTerm = $('searchInput').value.trim().toLowerCase();
    if (searchTerm) {
      filtered = filtered.filter(p => p.asin.toLowerCase().includes(searchTerm));
    }

    // 排序
    const sortValue = $('sortSelect').value;
    filtered = [...filtered].sort((a, b) => {
      switch (sortValue) {
        case 'salesDesc': return b.monthlySales - a.monthlySales;
        case 'salesAsc': return a.monthlySales - b.monthlySales;
        case 'asinAsc': return a.asin.localeCompare(b.asin);
        case 'asinDesc': return b.asin.localeCompare(a.asin);
        default: return 0;
      }
    });

    return filtered;
  }

  // ============================================================
  // 产品渲染
  // ============================================================
  function renderProducts() {
    const filtered = getFilteredProducts();
    const pageSize = Number($('pageSizeSelect').value) || 100;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    
    // 确保当前页在有效范围内
    currentPage = Math.min(currentPage, totalPages);
    currentPage = Math.max(1, currentPage);

    const startIndex = (currentPage - 1) * pageSize;
    const endIndex = startIndex + pageSize;
    const pageProducts = filtered.slice(startIndex, endIndex);

    // 更新状态信息
    $('statusText').textContent = `共 ${filtered.length} 个产品`;
    $('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 页`;

    // 渲染产品卡片
    const grid = $('productGrid');
    grid.innerHTML = '';

    if (pageProducts.length === 0) {
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#999;">暂无产品数据</div>';
      return;
    }

    pageProducts.forEach(product => {
      const card = createProductCard(product);
      grid.appendChild(card);
    });

    // 更新分页按钮状态
    $('prevBtn').disabled = currentPage <= 1;
    $('nextBtn').disabled = currentPage >= totalPages;
  }

  // ============================================================
  // 创建产品卡片
  // ============================================================
  function createProductCard(product) {
    const card = document.createElement('div');
    card.className = 'card';

    // 图片容器
    const imgBox = document.createElement('div');
    imgBox.className = 'imgbox';

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = product.asin;
    
    // 优先使用 image（商品主图），如果为空则用占位图
    if (product.image) {
      img.src = product.image;
      img.onerror = () => {
        img.src = placeholderSvg('加载失败');
      };
    } else {
      img.src = placeholderSvg('暂无图片');
    }

    imgBox.appendChild(img);
    card.appendChild(imgBox);

    // 产品信息
    const meta = document.createElement('div');
    meta.className = 'meta';

    const asinDiv = document.createElement('div');
    asinDiv.className = 'asin';
    asinDiv.textContent = `ASIN: ${product.asin}`;
    meta.appendChild(asinDiv);

    const salesDiv = document.createElement('div');
    salesDiv.className = 'sales';
    salesDiv.innerHTML = `<strong>月销量:</strong> ${product.monthlySales.toLocaleString()}`;
    meta.appendChild(salesDiv);

    const marginDiv = document.createElement('div');
    marginDiv.className = 'margin';
    marginDiv.innerHTML = `<strong>毛利率:</strong> ${product.grossMargin}`;
    meta.appendChild(marginDiv);

    const priceDiv = document.createElement('div');
    priceDiv.className = 'price';
    priceDiv.innerHTML = `<strong>价格:</strong> $${product.price}`;
    meta.appendChild(priceDiv);

    // 打开亚马逊按钮
    const amazonUrl = product.detailUrl || `https://www.amazon.com/dp/${product.asin}`;
    const amazonLink = document.createElement('a');
    amazonLink.className = 'amazon-link';
    amazonLink.href = amazonUrl;
    amazonLink.target = '_blank';
    amazonLink.rel = 'noopener noreferrer';
    amazonLink.textContent = '打开亚马逊';
    meta.appendChild(amazonLink);

    // 4 个功能按钮
    const actionButtons = document.createElement('div');
    actionButtons.className = 'action-buttons';

    const buttons = [
      { text: '生成图片方案', action: 'generateImage' },
      { text: '生成listing', action: 'generateListing' },
      { text: '利润计算', action: 'profitCalc' },
      { text: '产品分析', action: 'productAnalysis' }
    ];

    buttons.forEach(btn => {
      const button = document.createElement('button');
      button.className = 'action-btn';
      button.textContent = btn.text;
      button.onclick = () => handleAction(btn.action, product);
      actionButtons.appendChild(button);
    });

    meta.appendChild(actionButtons);
    card.appendChild(meta);

    return card;
  }

  // ============================================================
  // 功能按钮处理
  // ============================================================
  function handleAction(action, product) {
    const modal = $('actionModal');
    const modalTitle = $('modalTitle');
    const modalBody = $('modalBody');

    // 设置标题
    const titles = {
      'generateImage': '生成图片方案',
      'generateListing': '生成 Listing',
      'profitCalc': '利润计算',
      'productAnalysis': '产品分析'
    };
    modalTitle.textContent = titles[action] || '功能';

    // 设置内容
    modalBody.innerHTML = `
      <div class="field"><strong>ASIN:</strong> ${product.asin}</div>
      <div class="field"><strong>类目:</strong> ${product.smallCategory}</div>
      <div class="field"><strong>月销量:</strong> ${product.monthlySales.toLocaleString()}</div>
      <div class="field"><strong>毛利率:</strong> ${product.grossMargin}</div>
      <div class="ai-output">
        <h4>AI 输出区域（预留）</h4>
        <p style="color:#999;">此处将来会显示 AI 生成的内容...</p>
        <p style="color:#999;">当前为占位版本，已将产品信息打印到控制台。</p>
      </div>
    `;

    // 打印到控制台
    console.log(`[${action}] 产品信息:`, {
      asin: product.asin,
      category: product.smallCategory,
      allCategories: product.allCategories,
      monthlySales: product.monthlySales,
      grossMargin: product.grossMargin,
      image: product.image,
      detailUrl: product.detailUrl
    });

    // 显示 modal
    modal.style.display = 'block';
  }

  // ============================================================
  // 事件监听
  // ============================================================
  
  // 类目选择
  $('categorySelect').addEventListener('change', (e) => {
    currentCategory = e.target.value;
    currentPage = 1;
    renderProducts();
  });

  // 搜索
  $('searchInput').addEventListener('input', () => {
    currentPage = 1;
    renderProducts();
  });

  // 排序
  $('sortSelect').addEventListener('change', () => {
    currentPage = 1;
    renderProducts();
  });

  // 每页数量
  $('pageSizeSelect').addEventListener('change', () => {
    currentPage = 1;
    renderProducts();
  });

  // 分页
  $('prevBtn').addEventListener('click', () => {
    if (currentPage > 1) {
      currentPage--;
      renderProducts();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  $('nextBtn').addEventListener('click', () => {
    currentPage++;
    renderProducts();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // Modal 关闭
  const modal = $('actionModal');
  const closeBtn = document.querySelector('.close');
  
  closeBtn.onclick = () => {
    modal.style.display = 'none';
  };

  window.onclick = (event) => {
    if (event.target === modal) {
      modal.style.display = 'none';
    }
  };

  // ============================================================
  // 初始化
  // ============================================================
  loadData();
</script>
</body>
</html>
