<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提示词</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #fafafa; 
      padding: 20px; 
      max-width: 1200px; 
      margin: 0 auto; 
    }
    h2 { margin: 0 0 20px; }
    .top-actions { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      align-items: center; 
      margin-bottom: 20px; 
    }
    .nav-btn { 
      padding: 8px 16px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      background: #fff; 
      text-decoration: none; 
      color: #333; 
      display: inline-block;
    }
    .nav-btn.primary { 
      background: #111; 
      color: #fff; 
      border-color: #111; 
    }
    
    .dropdown { position:relative; display:inline-block; }
    .dropdown .nav-btn { cursor:pointer; }
    .dropdown-content { display:none; position:absolute; background-color:#fff; min-width:180px; box-shadow:0 8px 16px rgba(0,0,0,.1); border-radius:8px; z-index:1000; border:1px solid #ddd; margin-top:4px; }
    .dropdown-content a { color:#333; padding:10px 16px; text-decoration:none; display:block; border-radius:0; }
    .dropdown-content a:first-child { border-radius:8px 8px 0 0; }
    .dropdown-content a:last-child { border-radius:0 0 8px 8px; }
    .dropdown-content a:hover { background-color:#f5f5f5; }
    .dropdown:hover .dropdown-content { display:block; }
    
    .add-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }
    
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    textarea {
      min-height: 100px;
      resize: vertical;
      font-family: inherit;
    }
    
    button {
      padding: 10px 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
      margin-top: 10px;
    }
    
    button:hover {
      background: #333;
    }
    
    button.secondary {
      background: #fff;
      color: #333;
      border-color: #ddd;
    }
    
    button.secondary:hover {
      background: #f5f5f5;
    }
    
    button.danger {
      background: #b00020;
      color: #fff;
      border-color: #b00020;
    }
    
    button.danger:hover {
      background: #c00020;
    }
    
    .prompt-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      margin: 0;
    }
    
    .section-actions {
      display: flex;
      gap: 10px;
    }
    
    .prompt-item {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 3px solid #111;
    }
    
    .prompt-content {
      color: #333;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    
    .prompt-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    
    .add-prompt-form {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }
    
    .subtitle-section {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      border-left: 3px solid #666;
    }
    
    .subtitle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .subtitle-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin: 0;
    }
    
    .subtitle-actions {
      display: flex;
      gap: 8px;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .hidden {
      display: none;
    }
    
    button.small {
      padding: 6px 12px;
      font-size: 12px;
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="top-actions">
    <a class="nav-btn primary" href="/">去看亚马逊新品</a>
    <a class="nav-btn" href="/articles/">产品开发系列</a>
    <div class="dropdown">
      <a class="nav-btn" href="#">大模型 ▼</a>
      <div class="dropdown-content">
        <a href="/model-nano-banana-pro.html">Nano Banana Pro</a>
        <a href="/model-gpt-image-1.5.html">GPT Image 1.5</a>
        <a href="/model-seedream-4.5.html">Seedream 4.5</a>
        <a href="/model-gemini-3.html">Gemini 3</a>
      </div>
    </div>
    <a class="nav-btn" href="/1688.html">1688</a>
    <a class="nav-btn" href="/tiktok.html">TikTok</a>
  </div>

  <h2>提示词</h2>

  <div class="add-section">
    <h3 style="margin-top: 0;">添加新标题</h3>
    <div class="form-group">
      <label for="newTitle">标题名称：</label>
      <input type="text" id="newTitle" placeholder="例如：产品分析提示词" />
    </div>
    <button onclick="addNewSection()">添加标题</button>
  </div>
  
  <div class="add-section">
    <h3 style="margin-top: 0;">添加子标题</h3>
    <div class="form-group">
      <label for="parentSection">选择父标题：</label>
      <select id="parentSection" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
        <option value="">请选择...</option>
      </select>
    </div>
    <div class="form-group">
      <label for="newSubtitle">子标题名称：</label>
      <input type="text" id="newSubtitle" placeholder="例如：GPT5.2" />
    </div>
    <button onclick="addNewSubtitle()">添加子标题</button>
  </div>

  <div id="sections"></div>

  <script>
    // 从 localStorage 加载数据
    function loadData() {
      const data = localStorage.getItem('prompts');
      return data ? JSON.parse(data) : [];
    }

    // 保存数据到 localStorage
    function saveData(data) {
      localStorage.setItem('prompts', JSON.stringify(data));
    }

    // 添加新标题
    function addNewSection() {
      const titleInput = document.getElementById('newTitle');
      const title = titleInput.value.trim();
      
      if (!title) {
        alert('请输入标题名称');
        return;
      }

      const data = loadData();
      const newSection = {
        id: Date.now().toString(),
        title: title,
        subtitles: []
      };
      
      data.push(newSection);
      saveData(data);
      titleInput.value = '';
      render();
    }
    
    // 添加子标题
    function addNewSubtitle() {
      const parentSelect = document.getElementById('parentSection');
      const subtitleInput = document.getElementById('newSubtitle');
      const parentId = parentSelect.value;
      const subtitleName = subtitleInput.value.trim();
      
      if (!parentId) {
        alert('请选择父标题');
        return;
      }
      
      if (!subtitleName) {
        alert('请输入子标题名称');
        return;
      }

      const data = loadData();
      const section = data.find(s => s.id === parentId);
      if (section) {
        if (!section.subtitles) {
          section.subtitles = [];
        }
        section.subtitles.push({
          id: Date.now().toString(),
          name: subtitleName,
          prompts: []
        });
        saveData(data);
        subtitleInput.value = '';
        render();
      }
    }

    // 删除标题
    function deleteSection(sectionId) {
      if (!confirm('确定要删除这个标题及其所有子标题和提示词吗？')) {
        return;
      }
      
      const data = loadData();
      const filtered = data.filter(s => s.id !== sectionId);
      saveData(filtered);
      render();
    }
    
    // 删除子标题
    function deleteSubtitle(sectionId, subtitleId) {
      if (!confirm('确定要删除这个子标题及其所有提示词吗？')) {
        return;
      }
      
      const data = loadData();
      const section = data.find(s => s.id === sectionId);
      if (section && section.subtitles) {
        section.subtitles = section.subtitles.filter(st => st.id !== subtitleId);
        saveData(data);
        render();
      }
    }

    // 添加提示词
    function addPrompt(sectionId, subtitleId) {
      const inputId = subtitleId ? `prompt-input-${sectionId}-${subtitleId}` : `prompt-input-${sectionId}`;
      const textarea = document.getElementById(inputId);
      const content = textarea.value.trim();
      
      if (!content) {
        alert('请输入提示词内容');
        return;
      }

      const data = loadData();
      const section = data.find(s => s.id === sectionId);
      if (section) {
        if (subtitleId) {
          // 添加到子标题
          const subtitle = section.subtitles?.find(st => st.id === subtitleId);
          if (subtitle) {
            if (!subtitle.prompts) subtitle.prompts = [];
            subtitle.prompts.push({
              id: Date.now().toString(),
              content: content
            });
          }
        } else {
          // 直接添加到标题（兼容旧数据）
          if (!section.prompts) section.prompts = [];
          section.prompts.push({
            id: Date.now().toString(),
            content: content
          });
        }
        saveData(data);
        textarea.value = '';
        render();
      }
    }

    // 删除提示词
    function deletePrompt(sectionId, promptId, subtitleId) {
      const data = loadData();
      const section = data.find(s => s.id === sectionId);
      if (section) {
        if (subtitleId) {
          // 从子标题删除
          const subtitle = section.subtitles?.find(st => st.id === subtitleId);
          if (subtitle && subtitle.prompts) {
            subtitle.prompts = subtitle.prompts.filter(p => p.id !== promptId);
          }
        } else {
          // 从标题删除（兼容旧数据）
          if (section.prompts) {
            section.prompts = section.prompts.filter(p => p.id !== promptId);
          }
        }
        saveData(data);
        render();
      }
    }

    // 编辑提示词
    function editPrompt(sectionId, promptId, subtitleId) {
      const data = loadData();
      const section = data.find(s => s.id === sectionId);
      if (section) {
        let prompt = null;
        if (subtitleId) {
          const subtitle = section.subtitles?.find(st => st.id === subtitleId);
          if (subtitle && subtitle.prompts) {
            prompt = subtitle.prompts.find(p => p.id === promptId);
          }
        } else {
          if (section.prompts) {
            prompt = section.prompts.find(p => p.id === promptId);
          }
        }
        if (prompt) {
          const newContent = window.prompt('请输入新的提示词内容：', prompt.content);
          if (newContent !== null && newContent.trim()) {
            prompt.content = newContent.trim();
            saveData(data);
            render();
          }
        }
      }
    }

    // 复制提示词
    function copyPrompt(content) {
      navigator.clipboard.writeText(content).then(() => {
        alert('已复制到剪贴板');
      }).catch(() => {
        // 降级方案
        const textarea = document.createElement('textarea');
        textarea.value = content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('已复制到剪贴板');
      });
    }

    // 更新父标题选择器
    function updateParentSelect() {
      const select = document.getElementById('parentSection');
      const data = loadData();
      select.innerHTML = '<option value="">请选择...</option>';
      data.forEach(section => {
        const option = document.createElement('option');
        option.value = section.id;
        option.textContent = section.title;
        select.appendChild(option);
      });
    }

    // 渲染所有内容
    function render() {
      const data = loadData();
      const container = document.getElementById('sections');
      
      // 更新父标题选择器
      updateParentSelect();
      
      if (data.length === 0) {
        container.innerHTML = '<div class="empty-state">还没有添加任何标题，请在上方添加一个标题开始使用。</div>';
        return;
      }

      container.innerHTML = '';

      data.forEach(section => {
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'prompt-section';
        
        // 渲染子标题
        let subtitlesHtml = '';
        if (section.subtitles && section.subtitles.length > 0) {
          subtitlesHtml = section.subtitles.map(subtitle => {
            const promptsHtml = subtitle.prompts && subtitle.prompts.length > 0 
              ? subtitle.prompts.map(p => `
                <div class="prompt-item">
                  <div class="prompt-content">${escapeHtml(p.content)}</div>
                  <div class="prompt-actions">
                    <button class="secondary small" onclick="copyPrompt('${escapeJs(p.content)}')">复制</button>
                    <button class="secondary small" onclick="editPrompt('${section.id}', '${p.id}', '${subtitle.id}')">编辑</button>
                    <button class="danger small" onclick="deletePrompt('${section.id}', '${p.id}', '${subtitle.id}')">删除</button>
                  </div>
                </div>
              `).join('')
              : '<div class="empty-state" style="padding: 20px;">该子标题下还没有提示词</div>';
            
            return `
              <div class="subtitle-section">
                <div class="subtitle-header">
                  <h4 class="subtitle-title">${escapeHtml(subtitle.name)}</h4>
                  <div class="subtitle-actions">
                    <button class="danger small" onclick="deleteSubtitle('${section.id}', '${subtitle.id}')">删除子标题</button>
                  </div>
                </div>
                ${promptsHtml}
                <div class="add-prompt-form">
                  <label for="prompt-input-${section.id}-${subtitle.id}">添加新提示词：</label>
                  <textarea id="prompt-input-${section.id}-${subtitle.id}" placeholder="输入提示词内容..."></textarea>
                  <button class="small" onclick="addPrompt('${section.id}', '${subtitle.id}')">添加提示词</button>
                </div>
              </div>
            `;
          }).join('');
        }
        
        // 兼容旧数据：直接显示在标题下的提示词
        let directPromptsHtml = '';
        if (section.prompts && section.prompts.length > 0) {
          directPromptsHtml = section.prompts.map(p => `
            <div class="prompt-item">
              <div class="prompt-content">${escapeHtml(p.content)}</div>
              <div class="prompt-actions">
                <button class="secondary small" onclick="copyPrompt('${escapeJs(p.content)}')">复制</button>
                <button class="secondary small" onclick="editPrompt('${section.id}', '${p.id}')">编辑</button>
                <button class="danger small" onclick="deletePrompt('${section.id}', '${p.id}')">删除</button>
              </div>
            </div>
          `).join('');
        }
        
        sectionDiv.innerHTML = `
          <div class="section-header">
            <h3 class="section-title">${escapeHtml(section.title)}</h3>
            <div class="section-actions">
              <button class="danger" onclick="deleteSection('${section.id}')">删除标题</button>
            </div>
          </div>
          
          ${subtitlesHtml}
          
          ${directPromptsHtml}
          
          ${!section.subtitles || section.subtitles.length === 0 ? `
            <div class="add-prompt-form">
              <label for="prompt-input-${section.id}">添加新提示词：</label>
              <textarea id="prompt-input-${section.id}" placeholder="输入提示词内容..."></textarea>
              <button onclick="addPrompt('${section.id}')">添加提示词</button>
            </div>
          ` : ''}
        `;
        
        container.appendChild(sectionDiv);
      });
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // JavaScript 字符串转义
    function escapeJs(text) {
      return text.replace(/\\/g, '\\\\')
                 .replace(/'/g, "\\'")
                 .replace(/"/g, '\\"')
                 .replace(/\n/g, '\\n')
                 .replace(/\r/g, '\\r');
    }

    // 初始化
    render();
  </script>
</body>
</html>
