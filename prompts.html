<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提示词</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #fafafa; 
      padding: 20px; 
      max-width: 1200px; 
      margin: 0 auto; 
    }
    h2 { margin: 0 0 20px; }
    .top-actions { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      align-items: center; 
      margin-bottom: 20px; 
    }
    .nav-btn { 
      padding: 8px 16px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      background: #fff; 
      text-decoration: none; 
      color: #333; 
      display: inline-block;
    }
    .nav-btn.primary { 
      background: #111; 
      color: #fff; 
      border-color: #111; 
    }
    
    .add-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }
    
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    textarea {
      min-height: 100px;
      resize: vertical;
      font-family: inherit;
    }
    
    button {
      padding: 10px 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
      margin-top: 10px;
    }
    
    button:hover {
      background: #333;
    }
    
    button.secondary {
      background: #fff;
      color: #333;
      border-color: #ddd;
    }
    
    button.secondary:hover {
      background: #f5f5f5;
    }
    
    button.danger {
      background: #b00020;
      color: #fff;
      border-color: #b00020;
    }
    
    button.danger:hover {
      background: #c00020;
    }
    
    .prompt-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      margin: 0;
    }
    
    .section-actions {
      display: flex;
      gap: 10px;
    }
    
    .prompt-item {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 3px solid #111;
    }
    
    .prompt-content {
      color: #333;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    
    .prompt-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    
    .add-prompt-form {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="top-actions">
    <a class="nav-btn primary" href="/">去看亚马逊新品</a>
    <a class="nav-btn" href="/articles/">产品开发系列</a>
    <a class="nav-btn" href="/1688.html">1688</a>
    <a class="nav-btn" href="/tiktok.html">TikTok</a>
  </div>

  <h2>提示词管理</h2>

  <div class="add-section">
    <h3 style="margin-top: 0;">添加新标题</h3>
    <div class="form-group">
      <label for="newTitle">标题名称：</label>
      <input type="text" id="newTitle" placeholder="例如：产品分析提示词" />
    </div>
    <button onclick="addNewSection()">添加标题</button>
  </div>

  <div id="sections"></div>

  <script>
    // 从 localStorage 加载数据
    function loadData() {
      const data = localStorage.getItem('prompts');
      return data ? JSON.parse(data) : [];
    }

    // 保存数据到 localStorage
    function saveData(data) {
      localStorage.setItem('prompts', JSON.stringify(data));
    }

    // 添加新标题
    function addNewSection() {
      const titleInput = document.getElementById('newTitle');
      const title = titleInput.value.trim();
      
      if (!title) {
        alert('请输入标题名称');
        return;
      }

      const data = loadData();
      const newSection = {
        id: Date.now().toString(),
        title: title,
        prompts: []
      };
      
      data.push(newSection);
      saveData(data);
      titleInput.value = '';
      render();
    }

    // 删除标题
    function deleteSection(sectionId) {
      if (!confirm('确定要删除这个标题及其所有提示词吗？')) {
        return;
      }
      
      const data = loadData();
      const filtered = data.filter(s => s.id !== sectionId);
      saveData(filtered);
      render();
    }

    // 添加提示词
    function addPrompt(sectionId) {
      const textarea = document.getElementById(`prompt-input-${sectionId}`);
      const content = textarea.value.trim();
      
      if (!content) {
        alert('请输入提示词内容');
        return;
      }

      const data = loadData();
      const section = data.find(s => s.id === sectionId);
      if (section) {
        section.prompts.push({
          id: Date.now().toString(),
          content: content
        });
        saveData(data);
        textarea.value = '';
        render();
      }
    }

    // 删除提示词
    function deletePrompt(sectionId, promptId) {
      const data = loadData();
      const section = data.find(s => s.id === sectionId);
      if (section) {
        section.prompts = section.prompts.filter(p => p.id !== promptId);
        saveData(data);
        render();
      }
    }

    // 编辑提示词
    function editPrompt(sectionId, promptId) {
      const data = loadData();
      const section = data.find(s => s.id === sectionId);
      if (section) {
        const prompt = section.prompts.find(p => p.id === promptId);
        if (prompt) {
          const newContent = window.prompt('请输入新的提示词内容：', prompt.content);
          if (newContent !== null && newContent.trim()) {
            prompt.content = newContent.trim();
            saveData(data);
            render();
          }
        }
      }
    }

    // 复制提示词
    function copyPrompt(content) {
      navigator.clipboard.writeText(content).then(() => {
        alert('已复制到剪贴板');
      }).catch(() => {
        // 降级方案
        const textarea = document.createElement('textarea');
        textarea.value = content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('已复制到剪贴板');
      });
    }

    // 渲染所有内容
    function render() {
      const data = loadData();
      const container = document.getElementById('sections');
      
      if (data.length === 0) {
        container.innerHTML = '<div class="empty-state">还没有添加任何标题，请在上方添加一个标题开始使用。</div>';
        return;
      }

      container.innerHTML = '';

      data.forEach(section => {
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'prompt-section';
        
        sectionDiv.innerHTML = `
          <div class="section-header">
            <h3 class="section-title">${escapeHtml(section.title)}</h3>
            <div class="section-actions">
              <button class="danger" onclick="deleteSection('${section.id}')">删除标题</button>
            </div>
          </div>
          
          ${section.prompts.length > 0 ? section.prompts.map(p => `
            <div class="prompt-item">
              <div class="prompt-content">${escapeHtml(p.content)}</div>
              <div class="prompt-actions">
                <button class="secondary" onclick="copyPrompt('${escapeJs(p.content)}')">复制</button>
                <button class="secondary" onclick="editPrompt('${section.id}', '${p.id}')">编辑</button>
                <button class="danger" onclick="deletePrompt('${section.id}', '${p.id}')">删除</button>
              </div>
            </div>
          `).join('') : '<div class="empty-state">该标题下还没有提示词</div>'}
          
          <div class="add-prompt-form">
            <label for="prompt-input-${section.id}">添加新提示词：</label>
            <textarea id="prompt-input-${section.id}" placeholder="输入提示词内容..."></textarea>
            <button onclick="addPrompt('${section.id}')">添加提示词</button>
          </div>
        `;
        
        container.appendChild(sectionDiv);
      });
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // JavaScript 字符串转义
    function escapeJs(text) {
      return text.replace(/\\/g, '\\\\')
                 .replace(/'/g, "\\'")
                 .replace(/"/g, '\\"')
                 .replace(/\n/g, '\\n')
                 .replace(/\r/g, '\\r');
    }

    // 初始化
    render();
  </script>
</body>
</html>
